  }
  .region-btn[disabled]{

  }
  .region-btn[disabled]:hover .tooltip{
    display:block;
  }
  .tooltip{
    display:none;
    position:absolute;
    top:120%;
    left:0;
    background:#0d1015;
    border:1px solid var(--border);

    font-weight:600;

,"sub":2,"grade":1,"q":1,"lv":0,"meta_ok":true,"of":[[0,10,48,262],[3,10,10,1],[5,10,15,21],[7,23,25,21],[9,73,80,18],[10,74,74,1]]},{"id":1000004,"n":"Rifle do Sentinela","cat":1,"sub":2,"grade":1,"q":1,"lv":0,"meta_ok":true,"of":[[0,10,11,111],[5,15,40,12],[6,15,15,1],[7,12,21,9],[8,46,51,9],[9,158,159,2],[10,102,102,2]]},{"id":152044,"n":"Scanner Médico","cat":8,"sub":34,"grade":2,"q":1,"lv":0,"meta_ok":true,"of":[[0,10,18,19]]},{"id":154045,"n":"Selo de Romanus","cat":8,"sub":34,"grade":4,"q":1,"lv":0,"meta_ok":true,"of":[[0,256,300,6]]},{"id":154025,"n":"Sensor de Força","cat":8,"sub":34,"grade":4,"q":1,"lv":0,"meta_ok":true,"of":[[0,80,89,3]]},{"id":151029,"n":"Spider-Bot de Brinquedo","cat":8,"sub":34,"grade":1,"q":1,"lv":0,"meta_ok":true,"of":[[0,9,13.75,20]]},{"id":151018,"n":"Tecido Cerimonial","cat":8,"sub":34,"grade":1,"q":1,"lv":0,"meta_ok":true,"of":[[0,1.444,14,20]]},{"id":152017,"n":"Teclado da Sala de Segurança","cat":8,"sub":34,"grade":2,"q":1,"lv":0,"meta_ok":true,"of":[[0,5,93,26]]},{"id":153053,"n":"Terminal Desatualizado","cat":8,"sub":34,"grade":3,"q":1,"lv":0,"meta_ok":true,"of":[[0,9,10,51]]},{"id":151038,"n":"Transceptor Quebrado","cat":8,"sub":34,"grade":1,"q":1,"lv":0,"meta_ok":true,"of":[[0,24,25,2]]},{"id":152035,"n":"Troféu Giratório","cat":8,"sub":34,"grade":2,"q":1,"lv":0,"meta_ok":true,"of":[[0,120,125,2]]},{"id":151042,"n":"Óleo de Máquina","cat":8,"sub":34,"grade":1,"q":1,"lv":0,"meta_ok":true,"of":[[0,1.375,305.5,32]]}]};

  // ---------- helpers ----------
  function normalize(s){
    return (s || "").toString()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase();
  }

  const priceFmt = new Intl.NumberFormat('pt-BR');
  function fmtPrice(v){
    if(v === null || v === undefined) return null;
    return priceFmt.format(v);
  }

  function sortedEntries(obj){
    return Object.keys(obj).map(k => [k, obj[k]]);
  }

  // ---------- precompute per-item derived data ----------
  const items = DATA.items.map(function(it){
    const variants = (it.of || []).map(function(v){
      return { ench: v[0], min: v[1], max: v[2], qty: v[3] };
    }).sort(function(a,b){ return a.ench - b.ench; });

    let totalQty = 0;
    let minPrice = null;
    variants.forEach(function(v){
      totalQty += (v.qty || 0);
      if(v.min !== null && v.min !== undefined){
        if(minPrice === null || v.min < minPrice) minPrice = v.min;
      }
    });

    const isAccordion = variants.length >= 2 || (variants.length === 1 && variants[0].ench > 0);

    return {
      raw: it,
      variants: variants,
      totalQty: totalQty,
      minPrice: minPrice,
      isAccordion: isAccordion,
      nameNorm: normalize(it.n)
    };
  });

  // ---------- state ----------
  const state = {
    search: "",
    cat: "",
    sub: "",
    grades: new Set(),
    qual: "",
    lvMin: null,
    lvMax: null,
    sort: "name"
  };

  // ---------- DOM refs ----------
  const el = {
    regionGroup: document.getElementById('regionGroup'),
    snapshotLabel: document.getElementById('snapshotLabel'),
    fSearch: document.getElementById('fSearch'),
    fCat: document.getElementById('fCat'),
    fSubWrap: document.getElementById('fSubWrap'),
    fSub: document.getElementById('fSub'),
    fGrade: document.getElementById('fGrade'),
    fQual: document.getElementById('fQual'),
    fLvMin: document.getElementById('fLvMin'),
    fLvMax: document.getElementById('fLvMax'),
    fSort: document.getElementById('fSort'),
    btnClear: document.getElementById('btnClear'),
    counter: document.getElementById('counter'),
    btnExpandAll: document.getElementById('btnExpandAll'),
    btnCollapseAll: document.getElementById('btnCollapseAll'),
    list: document.getElementById('list'),
    foot: document.getElementById('foot')
  };

  // ---------- static header/footer ----------
  function renderHeader(){
    el.snapshotLabel.textContent = DATA.meta.snapshot_label;

    DATA.regions.forEach(function(r){
      const btn = document.createElement('button');
      btn.className = 'region-btn' + (r.id === DATA.meta.region ? ' active' : '');
      btn.textContent = r.label;
      if(!r.available){
        btn.disabled = true;
        const tip = document.createElement('span');
        tip.className = 'tooltip';
        tip.textContent = 'sem snapshot desta região — pendente de captura';
        btn.appendChild(tip);
      }
      el.regionGroup.appendChild(btn);
    });

    el.foot.textContent = 'Dados: snapshot do mercado ' + DATA.meta.snapshot_label +
      ' + rfnext-data.sqlite (cliente 1.28.5). Preços são menor/maior anunciado, não média.';
  }

  function renderCatOptions(){
    const opts = sortedEntries(DATA.cats).sort(function(a,b){
      return a[1].localeCompare(b[1], 'pt-BR');
    });
    el.fCat.innerHTML = '<option value="">Todas</option>' +
      opts.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('');
  }

  function subsForCat(catId){
    // only subs actually present among items of that category
    const present = new Set();
    items.forEach(function(it){
      if(String(it.raw.cat) === String(catId) && it.raw.sub !== undefined && it.raw.sub !== null){
        present.add(String(it.raw.sub));
      }
    });
    return sortedEntries(DATA.subs)
      .filter(function(o){ return present.has(o[0]); })
      .sort(function(a,b){ return a[1].localeCompare(b[1], 'pt-BR'); });
  }

  function renderSubOptions(){
    if(!state.cat){
      el.fSubWrap.style.display = 'none';
      state.sub = '';
      el.fSub.innerHTML = '';
      return;
    }
    const opts = subsForCat(state.cat);
    if(opts.length === 0){
      el.fSubWrap.style.display = 'none';
      state.sub = '';
      el.fSub.innerHTML = '';
      return;
    }
    el.fSubWrap.style.display = '';
    const prevSub = state.sub;
    el.fSub.innerHTML = '<option value="">Todas</option>' +
      opts.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('');
    // keep selection if still valid
    if(prevSub && opts.some(function(o){ return o[0] === prevSub; })){
      el.fSub.value = prevSub;
    } else {
      state.sub = '';
      el.fSub.value = '';
    }
  }

  function renderGradeChips(){
    const opts = sortedEntries(DATA.grades).sort(function(a,b){
      return Number(a[0]) - Number(b[0]);
    });
    el.fGrade.innerHTML = '';
    opts.forEach(function(o){
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = o[1];
      chip.dataset.grade = o[0];
      chip.addEventListener('click', function(){
        if(state.grades.has(o[0])){
          state.grades.delete(o[0]);
          chip.classList.remove('active');
        } else {
          state.grades.add(o[0]);
          chip.classList.add('active');
        }
        renderList();
      });
      el.fGrade.appendChild(chip);
    });
  }

  // ---------- filtering / sorting ----------
  function filterItems(){
    const q = normalize(state.search);
    return items.filter(function(it){
      const raw = it.raw;
      if(q && it.nameNorm.indexOf(q) === -1) return false;
      if(state.cat && String(raw.cat) !== String(state.cat)) return false;
      if(state.sub && String(raw.sub) !== String(state.sub)) return false;
      if(state.grades.size > 0 && !state.grades.has(String(raw.grade))) return false;
      if(state.qual && String(raw.q) !== String(state.qual)) return false;
      if(state.lvMin !== null && !isNaN(state.lvMin) && (raw.lv || 0) < state.lvMin) return false;
      if(state.lvMax !== null && !isNaN(state.lvMax) && (raw.lv || 0) > state.lvMax) return false;
      return true;
    });
  }

  function sortItems(list){
    const arr = list.slice();
    switch(state.sort){
      case 'price_asc':
        arr.sort(function(a,b){
          const av = a.minPrice === null ? Infinity : a.minPrice;
          const bv = b.minPrice === null ? Infinity : b.minPrice;
          if(av !== bv) return av - bv;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'price_desc':
        arr.sort(function(a,b){
          const aNull = a.minPrice === null, bNull = b.minPrice === null;
          if(aNull && bNull) return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
          if(aNull) return 1;
          if(bNull) return -1;
          if(a.minPrice !== b.minPrice) return b.minPrice - a.minPrice;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'offers':
        arr.sort(function(a,b){
          if(b.totalQty !== a.totalQty) return b.totalQty - a.totalQty;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'level':
        arr.sort(function(a,b){
          const av = a.raw.lv || 0, bv = b.raw.lv || 0;
          if(av !== bv) return av - bv;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'name':
      default:
        arr.sort(function(a,b){ return a.raw.n.localeCompare(b.raw.n, 'pt-BR'); });
        break;
    }
    return arr;
  }

  // ---------- rendering badges ----------
  function badgeHtml(cls, text){
    return '<span class="badge ' + cls + '">' + text + '</span>';
  }

  function priceOrAbsent(v){
    if(v === null || v === undefined){
      return badgeHtml('absent', 'preço ausente');
    }
    return '<span class="price">' + fmtPrice(v) + '</span>';
  }

  function commonBadges(it){
    const raw = it.raw;
    let html = '';
    const gradeLabel = DATA.grades[String(raw.grade)];
    if(gradeLabel) html += badgeHtml('grade', gradeLabel);
    if(raw.q === 2) html += badgeHtml('prime', 'Prime');
    const subLabel = DATA.subs[String(raw.sub)];
    if(subLabel) html += badgeHtml('sub', subLabel);
    if(raw.lv && raw.lv > 0) html += badgeHtml('lv', 'Nv ' + raw.lv);
    if(raw.meta_ok === false) html += badgeHtml('nometa', 'sem metadados');
    return html;
  }

  function renderSimpleRow(it){
    const raw = it.raw;
    const v = it.variants[0] || { min: null, max: null, qty: 0 };
    const div = document.createElement('div');
    div.className = 'item-card simple';
    div.innerHTML =
      '<div class="row">' +
        '<div class="left-cluster">' +
          '<span class="item-name">' + escapeHtml(raw.n) + '</span>' +
          '<div class="badge-row">' + commonBadges(it) + '</div>' +
        '</div>' +
        '<div class="summary-right">' +
          '<span>' + priceOrAbsent(v.min) + '</span>' +
          '<span class="sep">·</span>' +
          '<span>' + priceOrAbsent(v.max) + '</span>' +
          '<span class="sep">·</span>' +
          '<span>' + (v.qty || 0) + ((v.qty || 0) === 1 ? ' oferta' : ' ofertas') + '</span>' +
        '</div>' +
      '</div>';
    return div;
  }

  function renderAccordion(it){
    const raw = it.raw;
    const details = document.createElement('details');
    details.className = 'item-card';

    const summary = document.createElement('summary');
    summary.innerHTML =
      '<div class="left-cluster">' +
        '<span class="item-name">' + escapeHtml(raw.n) + '</span>' +
        '<div class="badge-row">' + commonBadges(it) + '</div>' +
      '</div>' +
      '<div class="summary-right">' +
        '<span>a partir de ' + (it.minPrice === null ? badgeHtml('absent','preço ausente') : ('<span class="price">' + fmtPrice(it.minPrice) + '</span>')) + '</span>' +
        '<span class="sep">·</span>' +
        '<span>' + it.totalQty + (it.totalQty === 1 ? ' oferta' : ' ofertas') + '</span>' +
        '<span class="sep">·</span>' +
        '<span>' + it.variants.length + (it.variants.length === 1 ? ' variante' : ' variantes') + '</span>' +
      '</div>';
    details.appendChild(summary);

    const tableWrap = document.createElement('div');
    let rows = '';
    it.variants.forEach(function(v){
      rows +=
        '<tr>' +
          '<td class="ench">+' + v.ench + '</td>' +
          '<td class="price">' + priceOrAbsent(v.min) + '</td>' +
          '<td class="price">' + priceOrAbsent(v.max) + '</td>' +
          '<td>' + (v.qty || 0) + '</td>' +
        '</tr>';
    });
    tableWrap.innerHTML =
      '<table class="variants-table">' +
        '<thead><tr><th>Encanto</th><th>Menor preço</th><th>Maior preço</th><th>Ofertas</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
    details.appendChild(tableWrap);
    return details;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- main render ----------
  function renderList(){
    const filtered = filterItems();
    const sorted = sortItems(filtered);

    el.list.innerHTML = '';
    if(sorted.length === 0){
      const div = document.createElement('div');
      div.className = 'no-results';
      div.textContent = 'Nenhum item encontrado com os filtros atuais.';
      el.list.appendChild(div);
    } else {
      const frag = document.createDocumentFragment();
      sorted.forEach(function(it){
        frag.appendChild(it.isAccordion ? renderAccordion(it) : renderSimpleRow(it));
      });
      el.list.appendChild(frag);
    }

    let totalOffers = 0;
    sorted.forEach(function(it){ totalOffers += it.totalQty; });

    el.counter.innerHTML =
      '<b>' + sorted.length + '</b> itens · <b>' + totalOffers + '</b> ofertas ' +
      '(de ' + DATA.meta.bases + ' itens · ' + DATA.meta.entries + ' ofertas)';
  }

  // ---------- events ----------
  function bindEvents(){
    el.fSearch.addEventListener('input', function(){
      state.search = el.fSearch.value;
      renderList();
    });
    el.fCat.addEventListener('change', function(){
      state.cat = el.fCat.value;
      renderSubOptions();
      renderList();
    });
    el.fSub.addEventListener('change', function(){
      state.sub = el.fSub.value;
      renderList();
    });
    el.fQual.addEventListener('change', function(){
      state.qual = el.fQual.value;
      renderList();
    });
    el.fLvMin.addEventListener('input', function(){
      state.lvMin = el.fLvMin.value === '' ? null : Number(el.fLvMin.value);
      renderList();
    });
    el.fLvMax.addEventListener('input', function(){
      state.lvMax = el.fLvMax.value === '' ? null : Number(el.fLvMax.value);
      renderList();
    });
    el.fSort.addEventListener('change', function(){
      state.sort = el.fSort.value;
      renderList();
    });
    el.btnClear.addEventListener('click', function(){
      state.search = '';
      state.cat = '';
      state.sub = '';
      state.grades = new Set();
      state.qual = '';
      state.lvMin = null;
      state.lvMax = null;
      state.sort = 'name';

      el.fSearch.value = '';
      el.fCat.value = '';
      el.fQual.value = '';
      el.fLvMin.value = '';
      el.fLvMax.value = '';
      el.fSort.value = 'name';
      renderSubOptions();
      document.querySelectorAll('#fGrade .chip').forEach(function(c){ c.classList.remove('active'); });

      renderList();
    });
    el.btnExpandAll.addEventListener('click', function(){
      el.list.querySelectorAll('details.item-card').forEach(function(d){ d.open = true; });
    });
    el.btnCollapseAll.addEventListener('click', function(){
      el.list.querySelectorAll('details.item-card').forEach(function(d){ d.open = false; });
    });
  }

  // ---------- init ----------
  function init(){
    renderHeader();
    renderCatOptions();
    renderSubOptions();
    renderGradeChips();
    bindEvents();
    renderList();
  }

  init();
})();
</script>
