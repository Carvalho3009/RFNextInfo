<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado — RF Next</title>
<style>
  :root{
    --bg:#12151a;
    --bg-alt:#181c23;
    --panel:#1c212a;
    --panel-2:#232a35;
    --border:#2c333f;
    --border-soft:#262c37;
    --text:#e4e7ec;
    --text-dim:#9aa4b2;
    --text-faint:#6b7484;
    --accent:#4fa3e3;
    --accent-dim:#2d5f82;
    --amber:#d9a441;
    --amber-bg:#3a2f16;
    --amber-border:#5c4a1f;
    --gray-badge-bg:#2a2f38;
    --gray-badge-border:#3a4150;
    --prime:#c98be0;
    --prime-bg:#332b3d;
    --prime-border:#4a3a57;
    --good:#5fbf7f;
    --radius:6px;
    --mono: 'Consolas','SFMono-Regular',Menlo,Monaco,monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.4;
  }
  a{color:var(--accent);}
  button, select, input{
    font-family:inherit;
    font-size:13px;
    color:var(--text);
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:#333b47;border-radius:5px;}

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom:1px solid var(--border);
    gap:16px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-size:18px;
    margin:0;
    font-weight:700;
    letter-spacing:.3px;
    white-space:nowrap;
  }
  .region-group{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .region-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
    font-weight:600;
    position:relative;
  }
  .region-btn.active{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:#fff;
  }
  .region-btn[disabled]{
    cursor:not-allowed;
    opacity:.55;
  }
  .region-btn[disabled]:hover .tooltip{
    display:block;
  }
  .tooltip{
    display:none;
    position:absolute;
    top:120%;
    left:0;
    background:#0d1015;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 9px;
    border-radius:5px;
    font-size:11.5px;
    white-space:nowrap;
    z-index:50;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .snapshot-label{
    color:var(--text-dim);
    font-size:12.5px;
    white-space:nowrap;
  }
  .snapshot-label b{color:var(--text);font-weight:600;}

  .filters{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg-alt);
    border-bottom:1px solid var(--border);
    padding:10px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 14px;
    align-items:flex-end;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--text-faint);
    font-weight:600;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field select{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:6px 8px;
    outline:none;
  }
  .field input[type="text"]{width:200px;}
  .field input[type="number"]{width:70px;}
  .field select{min-width:120px;}
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .lvl-range{display:flex;align-items:center;gap:6px;}
  .lvl-range span{color:var(--text-faint);}

  .chips{display:flex;gap:5px;flex-wrap:wrap;max-width:260px;}
  .chip{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:5px 9px;
    border-radius:14px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    user-select:none;
  }
  .chip.active{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:#fff;
  }

  .btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
    font-weight:600;
  }
  .btn:hover{border-color:var(--accent);color:var(--text);}
  .btn.small{padding:4px 9px;font-size:12px;}

  .toolbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px 4px;
    flex-wrap:wrap;
    gap:8px;
  }
  .counter{
    color:var(--text-dim);
    font-size:12.5px;
  }
  .counter b{color:var(--text);}
  .expand-controls{display:flex;gap:6px;}

  main{
    padding:6px 20px 40px;
    max-width:1200px;
    margin:0 auto;
  }

  .item-card{
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
  }
  .item-card.simple .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .item-name{
    font-weight:600;
    font-size:13.5px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .badge-row{
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap:wrap;
  }
  .left-cluster{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    flex:1;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    padding:2px 7px;
    border-radius:4px;
    font-size:11px;
    font-weight:600;
    background:var(--gray-badge-bg);
    border:1px solid var(--gray-badge-border);
    color:var(--text-dim);
    white-space:nowrap;
  }
  .badge.grade{color:#c9d3e0;}
  .badge.prime{
    background:var(--prime-bg);
    border-color:var(--prime-border);
    color:var(--prime);
  }
  .badge.sub{color:var(--text-faint);}
  .badge.lv{color:var(--text-faint);}
  .badge.nometa{
    background:var(--gray-badge-bg);
    border-color:var(--gray-badge-border);
    color:var(--text-faint);
    font-style:italic;
  }
  .badge.absent{
    background:var(--amber-bg);
    border-color:var(--amber-border);
    color:var(--amber);
  }

  .summary-right{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text-dim);
    font-size:12.5px;
    white-space:nowrap;
  }
  .summary-right .price{color:var(--good);font-weight:700;font-family:var(--mono);}
  .summary-right .sep{color:var(--text-faint);}

  details.item-card > summary{
    list-style:none;
    cursor:pointer;
    padding:9px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  details.item-card > summary::-webkit-details-marker{display:none;}
  details.item-card > summary::before{
    content:"▸";
    color:var(--text-faint);
    margin-right:8px;
    transition:transform .12s ease;
    display:inline-block;
    flex-shrink:0;
  }
  details.item-card[open] > summary::before{
    transform:rotate(90deg);
  }
  details.item-card[open] > summary{
    border-bottom:1px solid var(--border-soft);
    background:var(--panel-2);
  }

  .variants-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  .variants-table th{
    text-align:left;
    padding:6px 14px;
    color:var(--text-faint);
    font-weight:600;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.4px;
    border-bottom:1px solid var(--border-soft);
  }
  .variants-table td{
    padding:6px 14px;
    border-bottom:1px solid var(--border-soft);
    font-family:var(--mono);
  }
  .variants-table tr:last-child td{border-bottom:none;}
  .variants-table td.price{color:var(--good);}
  .variants-table td.ench{color:var(--accent);font-weight:700;}

  .no-results{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
  }

  footer.foot{
    padding:16px 20px 30px;
    color:var(--text-faint);
    font-size:11.5px;
    text-align:center;
    border-top:1px solid var(--border-soft);
    margin-top:10px;
  }
</style>
</head>
<body>

<header class="top">
  <h1>Mercado — RF Next</h1>
  <div class="region-group" id="regionGroup"></div>
  <div class="snapshot-label">Snapshot: <b id="snapshotLabel"></b></div>
</header>

<div class="filters">
  <div class="field">
    <label for="fSearch">Buscar</label>
    <input type="text" id="fSearch" placeholder="Nome do item...">
  </div>
  <div class="field">
    <label for="fCat">Categoria</label>
    <select id="fCat"></select>
  </div>
  <div class="field" id="fSubWrap" style="display:none;">
    <label for="fSub">Subcategoria</label>
    <select id="fSub"></select>
  </div>
  <div class="field">
    <label>Grade</label>
    <div class="chips" id="fGrade"></div>
  </div>
  <div class="field">
    <label for="fQual">Qualidade</label>
    <select id="fQual">
      <option value="">Todas</option>
      <option value="1">Normal</option>
      <option value="2">Prime</option>
    </select>
  </div>
  <div class="field">
    <label>Nível de uso</label>
    <div class="lvl-range">
      <input type="number" id="fLvMin" placeholder="mín" min="0">
      <span>–</span>
      <input type="number" id="fLvMax" placeholder="máx" min="0">
    </div>
  </div>
  <div class="field">
    <label for="fSort">Ordenar por</label>
    <select id="fSort">
      <option value="price_asc">Menor preço ↑</option>
      <option value="price_desc">Menor preço ↓</option>
      <option value="offers">Mais ofertas</option>
      <option value="name">Nome A-Z</option>
      <option value="level">Nível</option>
    </select>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button class="btn" id="btnClear">Limpar filtros</button>
  </div>
</div>

<div class="toolbar-row">
  <div class="counter" id="counter"></div>
  <div class="expand-controls">
    <button class="btn small" id="btnExpandAll">Expandir todos</button>
    <button class="btn small" id="btnCollapseAll">Recolher todos</button>
  </div>
</div>

<main id="list"></main>

<footer class="foot" id="foot"></footer>

<script>
(function(){
  "use strict";

  const DATA = __DATASET_JSON__;

  // ---------- helpers ----------
  function normalize(s){
    return (s || "").toString()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase();
  }

  const priceFmt = new Intl.NumberFormat('pt-BR');
  function fmtPrice(v){
    if(v === null || v === undefined) return null;
    return priceFmt.format(v);
  }

  function sortedEntries(obj){
    return Object.keys(obj).map(k => [k, obj[k]]);
  }

  // ---------- precompute per-item derived data ----------
  const items = DATA.items.map(function(it){
    const variants = (it.of || []).map(function(v){
      return { ench: v[0], min: v[1], max: v[2], qty: v[3] };
    }).sort(function(a,b){ return a.ench - b.ench; });

    let totalQty = 0;
    let minPrice = null;
    variants.forEach(function(v){
      totalQty += (v.qty || 0);
      if(v.min !== null && v.min !== undefined){
        if(minPrice === null || v.min < minPrice) minPrice = v.min;
      }
    });

    const isAccordion = variants.length >= 2 || (variants.length === 1 && variants[0].ench > 0);

    return {
      raw: it,
      variants: variants,
      totalQty: totalQty,
      minPrice: minPrice,
      isAccordion: isAccordion,
      nameNorm: normalize(it.n)
    };
  });

  // ---------- state ----------
  const state = {
    search: "",
    cat: "",
    sub: "",
    grades: new Set(),
    qual: "",
    lvMin: null,
    lvMax: null,
    sort: "name"
  };

  // ---------- DOM refs ----------
  const el = {
    regionGroup: document.getElementById('regionGroup'),
    snapshotLabel: document.getElementById('snapshotLabel'),
    fSearch: document.getElementById('fSearch'),
    fCat: document.getElementById('fCat'),
    fSubWrap: document.getElementById('fSubWrap'),
    fSub: document.getElementById('fSub'),
    fGrade: document.getElementById('fGrade'),
    fQual: document.getElementById('fQual'),
    fLvMin: document.getElementById('fLvMin'),
    fLvMax: document.getElementById('fLvMax'),
    fSort: document.getElementById('fSort'),
    btnClear: document.getElementById('btnClear'),
    counter: document.getElementById('counter'),
    btnExpandAll: document.getElementById('btnExpandAll'),
    btnCollapseAll: document.getElementById('btnCollapseAll'),
    list: document.getElementById('list'),
    foot: document.getElementById('foot')
  };

  // ---------- static header/footer ----------
  function renderHeader(){
    el.snapshotLabel.textContent = DATA.meta.snapshot_label;

    DATA.regions.forEach(function(r){
      const btn = document.createElement('button');
      btn.className = 'region-btn' + (r.id === DATA.meta.region ? ' active' : '');
      btn.textContent = r.label;
      if(!r.available){
        btn.disabled = true;
        const tip = document.createElement('span');
        tip.className = 'tooltip';
        tip.textContent = 'sem snapshot desta região — pendente de captura';
        btn.appendChild(tip);
      }
      el.regionGroup.appendChild(btn);
    });

    el.foot.textContent = 'Dados: snapshot do mercado ' + DATA.meta.snapshot_label +
      ' + rfnext-data.sqlite (cliente 1.28.5). Preços são menor/maior anunciado, não média.';
  }

  function renderCatOptions(){
    const opts = sortedEntries(DATA.cats).sort(function(a,b){
      return a[1].localeCompare(b[1], 'pt-BR');
    });
    el.fCat.innerHTML = '<option value="">Todas</option>' +
      opts.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('');
  }

  function subsForCat(catId){
    // only subs actually present among items of that category
    const present = new Set();
    items.forEach(function(it){
      if(String(it.raw.cat) === String(catId) && it.raw.sub !== undefined && it.raw.sub !== null){
        present.add(String(it.raw.sub));
      }
    });
    return sortedEntries(DATA.subs)
      .filter(function(o){ return present.has(o[0]); })
      .sort(function(a,b){ return a[1].localeCompare(b[1], 'pt-BR'); });
  }

  function renderSubOptions(){
    if(!state.cat){
      el.fSubWrap.style.display = 'none';
      state.sub = '';
      el.fSub.innerHTML = '';
      return;
    }
    const opts = subsForCat(state.cat);
    if(opts.length === 0){
      el.fSubWrap.style.display = 'none';
      state.sub = '';
      el.fSub.innerHTML = '';
      return;
    }
    el.fSubWrap.style.display = '';
    const prevSub = state.sub;
    el.fSub.innerHTML = '<option value="">Todas</option>' +
      opts.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('');
    // keep selection if still valid
    if(prevSub && opts.some(function(o){ return o[0] === prevSub; })){
      el.fSub.value = prevSub;
    } else {
      state.sub = '';
      el.fSub.value = '';
    }
  }

  function renderGradeChips(){
    const opts = sortedEntries(DATA.grades).sort(function(a,b){
      return Number(a[0]) - Number(b[0]);
    });
    el.fGrade.innerHTML = '';
    opts.forEach(function(o){
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = o[1];
      chip.dataset.grade = o[0];
      chip.addEventListener('click', function(){
        if(state.grades.has(o[0])){
          state.grades.delete(o[0]);
          chip.classList.remove('active');
        } else {
          state.grades.add(o[0]);
          chip.classList.add('active');
        }
        renderList();
      });
      el.fGrade.appendChild(chip);
    });
  }

  // ---------- filtering / sorting ----------
  function filterItems(){
    const q = normalize(state.search);
    return items.filter(function(it){
      const raw = it.raw;
      if(q && it.nameNorm.indexOf(q) === -1) return false;
      if(state.cat && String(raw.cat) !== String(state.cat)) return false;
      if(state.sub && String(raw.sub) !== String(state.sub)) return false;
      if(state.grades.size > 0 && !state.grades.has(String(raw.grade))) return false;
      if(state.qual && String(raw.q) !== String(state.qual)) return false;
      if(state.lvMin !== null && !isNaN(state.lvMin) && (raw.lv || 0) < state.lvMin) return false;
      if(state.lvMax !== null && !isNaN(state.lvMax) && (raw.lv || 0) > state.lvMax) return false;
      return true;
    });
  }

  function sortItems(list){
    const arr = list.slice();
    switch(state.sort){
      case 'price_asc':
        arr.sort(function(a,b){
          const av = a.minPrice === null ? Infinity : a.minPrice;
          const bv = b.minPrice === null ? Infinity : b.minPrice;
          if(av !== bv) return av - bv;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'price_desc':
        arr.sort(function(a,b){
          const aNull = a.minPrice === null, bNull = b.minPrice === null;
          if(aNull && bNull) return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
          if(aNull) return 1;
          if(bNull) return -1;
          if(a.minPrice !== b.minPrice) return b.minPrice - a.minPrice;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'offers':
        arr.sort(function(a,b){
          if(b.totalQty !== a.totalQty) return b.totalQty - a.totalQty;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'level':
        arr.sort(function(a,b){
          const av = a.raw.lv || 0, bv = b.raw.lv || 0;
          if(av !== bv) return av - bv;
          return a.raw.n.localeCompare(b.raw.n, 'pt-BR');
        });
        break;
      case 'name':
      default:
        arr.sort(function(a,b){ return a.raw.n.localeCompare(b.raw.n, 'pt-BR'); });
        break;
    }
    return arr;
  }

  // ---------- rendering badges ----------
  function badgeHtml(cls, text){
    return '<span class="badge ' + cls + '">' + text + '</span>';
  }

  function priceOrAbsent(v){
    if(v === null || v === undefined){
      return badgeHtml('absent', 'preço ausente');
    }
    return '<span class="price">' + fmtPrice(v) + '</span>';
  }

  function commonBadges(it){
    const raw = it.raw;
    let html = '';
    const gradeLabel = DATA.grades[String(raw.grade)];
    if(gradeLabel) html += badgeHtml('grade', gradeLabel);
    if(raw.q === 2) html += badgeHtml('prime', 'Prime');
    const subLabel = DATA.subs[String(raw.sub)];
    if(subLabel) html += badgeHtml('sub', subLabel);
    if(raw.lv && raw.lv > 0) html += badgeHtml('lv', 'Nv ' + raw.lv);
    if(raw.meta_ok === false) html += badgeHtml('nometa', 'sem metadados');
    return html;
  }

  function renderSimpleRow(it){
    const raw = it.raw;
    const v = it.variants[0] || { min: null, max: null, qty: 0 };
    const div = document.createElement('div');
    div.className = 'item-card simple';
    div.innerHTML =
      '<div class="row">' +
        '<div class="left-cluster">' +
          '<span class="item-name">' + escapeHtml(raw.n) + '</span>' +
          '<div class="badge-row">' + commonBadges(it) + '</div>' +
        '</div>' +
        '<div class="summary-right">' +
          '<span>' + priceOrAbsent(v.min) + '</span>' +
          '<span class="sep">·</span>' +
          '<span>' + priceOrAbsent(v.max) + '</span>' +
          '<span class="sep">·</span>' +
          '<span>' + (v.qty || 0) + ((v.qty || 0) === 1 ? ' oferta' : ' ofertas') + '</span>' +
        '</div>' +
      '</div>';
    return div;
  }

  function renderAccordion(it){
    const raw = it.raw;
    const details = document.createElement('details');
    details.className = 'item-card';

    const summary = document.createElement('summary');
    summary.innerHTML =
      '<div class="left-cluster">' +
        '<span class="item-name">' + escapeHtml(raw.n) + '</span>' +
        '<div class="badge-row">' + commonBadges(it) + '</div>' +
      '</div>' +
      '<div class="summary-right">' +
        '<span>a partir de ' + (it.minPrice === null ? badgeHtml('absent','preço ausente') : ('<span class="price">' + fmtPrice(it.minPrice) + '</span>')) + '</span>' +
        '<span class="sep">·</span>' +
        '<span>' + it.totalQty + (it.totalQty === 1 ? ' oferta' : ' ofertas') + '</span>' +
        '<span class="sep">·</span>' +
        '<span>' + it.variants.length + (it.variants.length === 1 ? ' variante' : ' variantes') + '</span>' +
      '</div>';
    details.appendChild(summary);

    const tableWrap = document.createElement('div');
    let rows = '';
    it.variants.forEach(function(v){
      rows +=
        '<tr>' +
          '<td class="ench">+' + v.ench + '</td>' +
          '<td class="price">' + priceOrAbsent(v.min) + '</td>' +
          '<td class="price">' + priceOrAbsent(v.max) + '</td>' +
          '<td>' + (v.qty || 0) + '</td>' +
        '</tr>';
    });
    tableWrap.innerHTML =
      '<table class="variants-table">' +
        '<thead><tr><th>Encanto</th><th>Menor preço</th><th>Maior preço</th><th>Ofertas</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
    details.appendChild(tableWrap);
    return details;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- main render ----------
  function renderList(){
    const filtered = filterItems();
    const sorted = sortItems(filtered);

    el.list.innerHTML = '';
    if(sorted.length === 0){
      const div = document.createElement('div');
      div.className = 'no-results';
      div.textContent = 'Nenhum item encontrado com os filtros atuais.';
      el.list.appendChild(div);
    } else {
      const frag = document.createDocumentFragment();
      sorted.forEach(function(it){
        frag.appendChild(it.isAccordion ? renderAccordion(it) : renderSimpleRow(it));
      });
      el.list.appendChild(frag);
    }

    let totalOffers = 0;
    sorted.forEach(function(it){ totalOffers += it.totalQty; });

    el.counter.innerHTML =
      '<b>' + sorted.length + '</b> itens · <b>' + totalOffers + '</b> ofertas ' +
      '(de ' + DATA.meta.bases + ' itens · ' + DATA.meta.entries + ' ofertas)';
  }

  // ---------- events ----------
  function bindEvents(){
    el.fSearch.addEventListener('input', function(){
      state.search = el.fSearch.value;
      renderList();
    });
    el.fCat.addEventListener('change', function(){
      state.cat = el.fCat.value;
      renderSubOptions();
      renderList();
    });
    el.fSub.addEventListener('change', function(){
      state.sub = el.fSub.value;
      renderList();
    });
    el.fQual.addEventListener('change', function(){
      state.qual = el.fQual.value;
      renderList();
    });
    el.fLvMin.addEventListener('input', function(){
      state.lvMin = el.fLvMin.value === '' ? null : Number(el.fLvMin.value);
      renderList();
    });
    el.fLvMax.addEventListener('input', function(){
      state.lvMax = el.fLvMax.value === '' ? null : Number(el.fLvMax.value);
      renderList();
    });
    el.fSort.addEventListener('change', function(){
      state.sort = el.fSort.value;
      renderList();
    });
    el.btnClear.addEventListener('click', function(){
      state.search = '';
      state.cat = '';
      state.sub = '';
      state.grades = new Set();
      state.qual = '';
      state.lvMin = null;
      state.lvMax = null;
      state.sort = 'name';

      el.fSearch.value = '';
      el.fCat.value = '';
      el.fQual.value = '';
      el.fLvMin.value = '';
      el.fLvMax.value = '';
      el.fSort.value = 'name';
      renderSubOptions();
      document.querySelectorAll('#fGrade .chip').forEach(function(c){ c.classList.remove('active'); });

      renderList();
    });
    el.btnExpandAll.addEventListener('click', function(){
      el.list.querySelectorAll('details.item-card').forEach(function(d){ d.open = true; });
    });
    el.btnCollapseAll.addEventListener('click', function(){
      el.list.querySelectorAll('details.item-card').forEach(function(d){ d.open = false; });
    });
  }

  // ---------- init ----------
  function init(){
    renderHeader();
    renderCatOptions();
    renderSubOptions();
    renderGradeChips();
    bindEvents();
    renderList();
  }

  init();
})();
</script>
</body>
</html>
