<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Next — Custo de Craft</title>
<style>
:root{
  --ink:#070909;
  --ink-soft:#0d1110;
  --bone:#f4f2eb;
  --muted:#b9b5aa;
  --gold:#d4a64d;
  --gold-dark:#6d5428;
  --acid:#a8ff16;
  --coral:#ff6547;
  --water:#63b9f3;
  --arcane:#7659d6;
  --line: color-mix(in srgb, var(--gold) 48%, transparent);
  color-scheme: dark;
  --panel: rgb(13 17 16 / 82%);
  --panel2: rgb(244 242 235 / 6%);
  --disp: "Arial Narrow","Roboto Condensed",Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 75% 10%, rgb(212 166 77 / 7%), transparent 26rem),
    linear-gradient(rgb(255 255 255 / 1.5%) 1px, transparent 1px),
    linear-gradient(90deg, rgb(255 255 255 / 1.5%) 1px, transparent 1px),
    var(--ink);
  background-size: auto, 44px 44px, 44px 44px, auto;
  color:var(--bone);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  position:relative;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image: repeating-linear-gradient(115deg, transparent 0 7px, rgb(255 255 255 / 3%) 8px);
  opacity:.18;
  mix-blend-mode:soft-light;
  pointer-events:none;
  z-index:0;
}

/* -------- header (identidade Karvalho) -------- */
.site-header{
  position:sticky;top:0;z-index:5;position:relative;
  display:flex;align-items:center;gap:28px;
  min-height:86px;padding:0 24px;
  background:var(--ink);
  border-bottom:1px solid var(--line);
}
.site-header::after{
  content:"◆";
  position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);
  background:var(--ink);
  color:var(--gold);
  padding:0 .5rem;
  font-size:.8rem;
  line-height:1;
}
.brand{display:flex;align-items:center;text-decoration:none;line-height:0}
.brand img{height:52px;width:auto;display:block}
.site-header nav{display:flex;gap:26px}
.site-header nav a{
  color:var(--bone);
  text-decoration:none;
  font-family:var(--disp);
  font-weight:800;
  text-transform:uppercase;
  font-size:.8rem;
  letter-spacing:.14em;
}
.site-header nav a:hover{color:var(--acid)}
.site-header nav a[aria-current="page"]{color:var(--water)}
.domain{
  margin-left:auto;
  color:var(--gold);
  text-transform:uppercase;
  font-size:.72rem;
  letter-spacing:.12em;
}
@media (max-width:980px){ .domain{display:none} }

/* -------- layout -------- */
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 40px;position:relative;z-index:1}
.chapter{
  font-family:var(--disp);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:.74rem;
  color:var(--gold);
  margin-bottom:6px;
}
.page-title{
  font-family:var(--disp);
  text-transform:uppercase;
  font-weight:900;
  font-size:1.7rem;
  line-height:.95;
  letter-spacing:.01em;
  color:var(--bone);
  margin:0 0 20px;
}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:14px}
.card + .card{margin-top:12px}
h2{margin:0 0 10px;font-family:var(--disp);font-size:.82rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.1em}
.recipe-title h2{
  font-size:1.25rem;
  line-height:.95;
  letter-spacing:0;
  color:var(--bone);
}
h3{margin:0 0 8px;font-family:var(--disp);font-size:.74rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.14em}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select,input[type=text]{
  width:100%;background:var(--panel2);color:var(--bone);
  border:1px solid var(--line);border-radius:0;padding:8px 10px;
  font-size:13px;outline:none;
}
select:focus,input[type=text]:focus{border-color:var(--water);box-shadow:0 0 0 2px rgb(99 185 243 / 22%)}
.field{margin-bottom:10px}
.counters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.counter{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:6px 10px;font-size:12px;color:var(--muted)}
.counter b{color:var(--bone);font-size:13px}
.counter.full b{color:var(--acid)}
.counter.partial b{color:var(--gold)}
.counter.none b{color:var(--coral)}
.list{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:0}
.list-item{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--panel2)}
.list-item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--water)}
.list-item .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .id{color:var(--muted);font-size:11px}
.empty-list{padding:16px;color:var(--muted);text-align:center;font-size:12.5px}
.tag{
  display:inline-block;padding:2px 7px;border-radius:0;
  border:1px solid var(--gold-dark);background:transparent;
  font-family:var(--disp);
  font-size:.68rem;font-weight:700;line-height:1.6;
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
}
.tag.full{border-color:var(--acid);color:var(--acid)}
.tag.partial{border-color:var(--gold);color:var(--gold)}
.tag.none{border-color:var(--coral);color:var(--coral)}
.tag.muted{border-color:var(--line);color:var(--muted)}
.tag.ench{border-color:var(--water);color:var(--water)}
.mat-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mat-row:last-child{border-bottom:none}
.mat-name{font-size:13px}
.mat-sub{color:var(--muted);font-size:11.5px}
.mat-val{text-align:right;font-size:13px;white-space:nowrap}
.cred{color:var(--water);font-weight:700}
.warn{color:var(--coral)}
.muted{color:var(--muted)}
.summary-line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.summary-line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:14.5px;font-weight:700}
.alert{background:rgb(255 101 71 / 10%);border:1px solid rgb(255 101 71 / 35%);color:var(--coral);border-radius:0;padding:8px 10px;font-size:12.5px;margin-top:8px}
.roulette-row{padding:8px 0;border-bottom:1px solid var(--line)}
.roulette-row:last-child{border-bottom:none}
.roulette-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.roulette-bar{height:6px;border-radius:0;background:var(--panel2);overflow:hidden}
.roulette-bar > div{height:100%;background:var(--water)}
.roulette-bar.fail > div{background:var(--coral)}
.roulette-extra{margin-top:5px;font-size:12px;color:var(--muted)}
.placeholder{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px}
.recipe-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.recipe-title .rid{color:var(--muted);font-size:12px}
.recipe-cat{color:var(--muted);font-size:12px;margin-bottom:12px}
.searchbox{position:relative}
.no-data{padding:60px 20px;text-align:center;color:var(--muted)}
.no-data b{color:var(--bone)}

/* -------- footer -------- */
.site-footer{border-top:1px solid var(--line);margin-top:8px}
.footer-inner{
  max-width:1400px;margin:0 auto;padding:14px 24px;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;
  color:var(--muted);font-size:.82rem;
  position:relative;z-index:1;
}
.footer-brand{color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>
</head>

function keyStr(x){ return String(x); }

// Preço: SOMENTE a chave exata prices[item][ench]. Nunca cai para ench=0.
function getPrice(prices, item, ench){
  if(!prices) return undefined;
  const byItem = prices[keyStr(item)];
  if(!byItem) return undefined;
  const v = byItem[keyStr(ench)];
  return (typeof v === 'number') ? v : undefined;
}

// tradeable[item] === 0 => explicitamente NÃO comercializável.
// Ausência da chave (ou valor != 0) => considerado comercializável (apenas sem preço no momento).
function isNonTradeable(tradeable, item){
  if(!tradeable) return false;
  const k = keyStr(item);
  return Object.prototype.hasOwnProperty.call(tradeable, k) && tradeable[k] === 0;
}

// Soma o custo dos insumos precificados; reporta quantos foram precificados de quantos existem.
function computeMaterialsCost(mats, prices, tradeable){
  let sum = 0, pricedCount = 0;
  const details = (mats || []).map(function(m){
    const price = getPrice(prices, m.item, m.ench);
    const priced = price !== undefined;
    if(priced){ sum += m.qty * price; pricedCount++; }
    return {
      item: m.item, ench: m.ench, qty: m.qty,
      price: price,
      priced: priced,
      nonTradeable: !priced && isNonTradeable(tradeable, m.item)
    };
  });
  return { sum: sum, pricedCount: pricedCount, total: (mats || []).length, details: details };
}

// custo por tentativa = custo dos insumos precificados + taxa.
// allPriced indica se TODOS os insumos tinham preço (custo é exato, não um piso "≥").
function computeAttemptCost(recipe, prices, tradeable){
  const mc = computeMaterialsCost(recipe.mats, prices, tradeable);
  const fee = recipe.fee || 0;
  return {
    matsCost: mc.sum,
    fee: fee,
    attemptCost: mc.sum + fee,
    allPriced: mc.total > 0 ? (mc.pricedCount === mc.total) : true,
    pricedCount: mc.pricedCount,
    total: mc.total,
    matsDetails: mc.details
  };
}

// Desconto esperado pela devolução de falha. Só é aplicado se o item devolvido
// tiver preço na chave exata (ret_item, ret_ench); senão devolve "sem preço".
function computeFailDiscount(recipe, prices, tradeable){
  const fail = recipe.fail;
  if(!fail || !fail.prob){
    return { has: false, discount: 0, priced: true };
  }
  const price = getPrice(prices, fail.ret_item, fail.ret_ench);
  if(price === undefined){
    return { has: true, discount: 0, priced: false, retItem: fail.ret_item, retEnch: fail.ret_ench, retQty: fail.ret_qty, prob: fail.prob };
  }
  const discount = (fail.prob / 10000) * fail.ret_qty * price;
  return { has: true, discount: discount, priced: true, retItem: fail.ret_item, retEnch: fail.ret_ench, retQty: fail.ret_qty, prob: fail.prob, price: price };
}

// custo líquido = custo_por_tentativa - desconto de devolução (se aplicável)
function computeNetCost(attemptCost, failDiscount){
  if(failDiscount && failDiscount.has && failDiscount.priced){
    return attemptCost - failDiscount.discount;
  }
  return attemptCost;
}

// custo esperado por resultado específico = custo_liquido * 10000 / prob
// (só faz sentido quando todos os insumos estão precificados; a chamada
// deve ser condicionada a isso pelo chamador)
function computeExpectedCost(netCost, prob){
  if(!prob) return null;
  return netCost * (10000 / prob);
}

// custo por unidade para resultado determinístico (prob === 10000) com qty > 1
function computePerUnitCost(netCost, qty){
  if(!qty) return netCost;
  return netCost / qty;
}

function fmtNum(n, decimals){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const f = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return f.format(n);
}
function fmtCred(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return fmtNum(n, 2) + ' cr';
}
function fmtPct(prob){
  return fmtNum(prob / 100, 2) + '%';
}
function fmtAttempts(n){
  return fmtNum(n, 1);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

function itemName(names, id){
  if(names && Object.prototype.hasOwnProperty.call(names, keyStr(id))) return names[keyStr(id)];
  return 'item ' + id;
}

function enchTag(ench){
  if(!ench) return '';
  return '<span class="tag ench">+' + escapeHtml(ench) + '</span>';
}

    }
    return false;
  }

  function filteredRecipes(){
    return recipes.filter(function(r){
      const c = recipeCat(r);
      if(state.main && (!c || keyStr(c.main) !== state.main)) return false;
      if(state.sub && (!c || keyStr(c.sub) !== state.sub)) return false;
      if(!recipeMatchesSearch(r, state.search)) return false;
      return true;
    });
  }

  function mainResult(r){
    const rs = r.results || [];
    if(rs.length === 0) return null;
    let best = rs[0];
    rs.forEach(function(x){ if(x.prob > best.prob) best = x; });
    return best;
  }

  function renderList(){
    const list = filteredRecipes();
    listCountEl.textContent = '(' + fmtNum(list.length, 0) + ')';
    if(list.length === 0){
      listEl.innerHTML = '<div class="empty-list">Nenhuma receita encontrada.</div>';
      return;
    }
    listEl.innerHTML = list.map(function(r){
      const mr = mainResult(r);
      const label = mr ? (itemName(names, mr.item) + (mr.ench ? ' +' + mr.ench : '')) : ('receita ' + r.id);
      const cov = computed[r.uid].coverage;
      const active = state.selectedId === r.uid ? ' active' : '';
      return '<div class="list-item' + active + '" data-id="' + escapeHtml(r.uid) + '">' +
               '<div style="min-width:0">' +
                 '<div class="name">' + escapeHtml(label) + '</div>' +
                 '<div class="id">#' + escapeHtml(r.id) + '</div>' +
               '</div>' +
               '<span class="tag ' + cov + '">' + (cov === 'full' ? 'completo' : cov === 'partial' ? 'parcial' : 'sem preço') + '</span>' +
             '</div>';
    }).join('');
    Array.from(listEl.querySelectorAll('.list-item')).forEach(function(el){
      el.addEventListener('click', function(){
        const id = el.getAttribute('data-id');
        const r = recipes.find(function(x){ return keyStr(x.uid) === id; });
        if(r){ state.selectedId = r.uid; renderList(); renderDetail(r); }
      });
    });
  }

  function matRowHtml(m){
    const name = itemName(names, m.item);
    let valHtml;
    if(m.price !== undefined){
      valHtml = '<div class="mat-val">' + fmtNum(m.qty, 0) + ' × ' + fmtCred(m.price) + '<br><span class="mat-sub">= ' + fmtCred(m.qty * m.price) + '</span></div>';
    } else if(m.nonTradeable){
      valHtml = '<div class="mat-val"><span class="tag none">não comercializável</span><br><span class="mat-sub">' + fmtNum(m.qty, 0) + '×</span></div>';
    } else {
      valHtml = '<div class="mat-val"><span class="tag partial">preço ausente</span><br><span class="mat-sub">' + fmtNum(m.qty, 0) + '×</span></div>';
    }
    return '<div class="mat-row">' +
             '<div class="mat-name">' + escapeHtml(name) + ' ' + enchTag(m.ench) + '</div>' +
             valHtml +
           '</div>';
  }

  function renderRoulette(r, attempt, netCost, allPriced){
    const results = r.results || [];
    let html = '<h3>Roleta de resultado</h3>';
    results.forEach(function(res){
      const name = itemName(names, res.item);
      const pct = fmtPct(res.prob);
      let extra = '';
      if(allPriced){
        if(res.prob === 10000){
          if(res.qty > 1){
            const perUnit = computePerUnitCost(netCost, res.qty);
            extra = '<div class="roulette-extra">determinístico · custo por unidade: <span class="cred">' + fmtCred(perUnit) + '</span></div>';
          } else {
            extra = '<div class="roulette-extra">determinístico · custo: <span class="cred">' + fmtCred(netCost) + '</span></div>';
          }
        } else {
          const exp = computeExpectedCost(netCost, res.prob);
          extra = '<div class="roulette-extra">custo esperado: <span class="cred">' + fmtCred(exp) + '</span> · ≈ ' + fmtAttempts(10000 / res.prob) + ' tentativas em média</div>';
        }
      }
      html += '<div class="roulette-row">' +
                '<div class="roulette-head"><span>' + escapeHtml(name) + ' ' + enchTag(res.ench) + ' <span class="muted">×' + fmtNum(res.qty, 0) + '</span></span><span>' + pct + '</span></div>' +
                '<div class="roulette-bar"><div style="width:' + (res.prob / 100) + '%"></div></div>' +
                extra +
              '</div>';
    });
    if(r.fail && r.fail.prob){
      const fname = itemName(names, r.fail.ret_item);
      html += '<div class="roulette-row">' +
                '<div class="roulette-head"><span class="warn">Falha' + (r.fail.ret_qty ? (' · devolve ' + fmtNum(r.fail.ret_qty, 0) + '× ' + escapeHtml(fname) + enchTag(r.fail.ret_ench)) : '') + '</span><span class="warn">' + fmtPct(r.fail.prob) + '</span></div>' +
                '<div class="roulette-bar fail"><div style="width:' + (r.fail.prob / 100) + '%"></div></div>' +
              '</div>';
    }
    return html;
  }

  function renderDetail(r){
    const c = recipeCat(r);
    const attempt = computeAttemptCost(r, prices, tradeable);
    const failDiscount = computeFailDiscount(r, prices, tradeable);
    const netCost = computeNetCost(attempt.attemptCost, failDiscount);
    const allPriced = attempt.allPriced;

    let costBlock;
    if(attempt.total === 0){
      costBlock = '<div class="summary-line total"><span>sem insumos</span><span class="cred">' + fmtCred(attempt.fee) + '</span></div>';
    } else if(allPriced){
      costBlock =
        '<div class="summary-line"><span>insumos</span><span>' + fmtCred(attempt.matsCost) + '</span></div>' +
        '<div class="summary-line"><span>taxa</span><span>' + fmtCred(attempt.fee) + '</span></div>' +
        '<div class="summary-line total"><span>custo por tentativa</span><span class="cred">' + fmtCred(attempt.attemptCost) + '</span></div>';
    } else if(attempt.pricedCount > 0){
      costBlock =
        '<div class="summary-line"><span>insumos precificados</span><span>' + fmtCred(attempt.matsCost) + '</span></div>' +
        '<div class="summary-line"><span>taxa</span><span>' + fmtCred(attempt.fee) + '</span></div>' +
        '<div class="summary-line total"><span>custo por tentativa</span><span class="cred">≥ ' + fmtCred(attempt.attemptCost) + '</span></div>' +
        '<div class="alert">' + fmtNum(attempt.pricedCount, 0) + ' de ' + fmtNum(attempt.total, 0) + ' insumos precificados — valor é um piso, não o total real.</div>';
    } else {
      costBlock = '<div class="alert">sem dados de mercado para nenhum insumo desta receita.</div>';
    }

    let failBlock = '';
    if(failDiscount.has){
      if(failDiscount.priced){
        failBlock = '<div class="summary-line"><span class="muted">desconto esperado por devolução na falha</span><span>− ' + fmtCred(failDiscount.discount) + '</span></div>' +
                    '<div class="summary-line total"><span>custo líquido esperado por tentativa</span><span class="cred">' + fmtCred(netCost) + '</span></div>';
      } else {
        failBlock = '<div class="alert">devolve ' + fmtNum(failDiscount.retQty, 0) + '× ' + escapeHtml(itemName(names, failDiscount.retItem)) + enchTag(failDiscount.retEnch) + ' na falha (sem preço) — desconto não aplicado ao custo.</div>';
      }
    }

    detailCard.innerHTML =
      '<div class="recipe-title"><h2 style="margin:0">' + escapeHtml((mainResult(r) ? itemName(names, mainResult(r).item) : ('receita ' + r.id))) + '</h2><span class="rid">#' + escapeHtml(r.id) + '</span></div>' +
      '<div class="recipe-cat">' + (c ? ('aba ' + escapeHtml(c.main) + ' / ' + escapeHtml(c.sub)) : 'sem categoria') + '</div>' +
      '<h3>Insumos</h3>' +
      attempt.matsDetails.map(matRowHtml).join('') +
      '<div style="margin-top:12px">' + costBlock + failBlock + '</div>' +
      '<div style="margin-top:16px">' + renderRoulette(r, attempt, netCost, allPriced) + '</div>';
  }

  mainSel.addEventListener('change', function(){
    state.main = mainSel.value;
    state.sub = '';
    refreshSubOptions();
    renderList();
  });
  subSel.addEventListener('change', function(){
    state.sub = subSel.value;
    renderList();
  });
  searchInp.addEventListener('input', function(){
    state.search = searchInp.value;
    renderList();
  });

  renderList();
})();
</script>
</body>
</html>
