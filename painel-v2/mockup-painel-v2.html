<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Control v2 — Mockup navegável</title>
<style>
/* ============================================================
   MCP CONTROL v2 — Mockup navegável (SPEC-017 / F6 SPEC-014)
   Tokens EXATOS da identidade Karvalho (rooc-americas/mockup/styles.css)
   ============================================================ */
:root{
  --coal:#070909; --panel:#0e1211; --bone:#f4f2eb; --muted:#a7a6a0;
  --gold:#d4a64d; --acid:#a8ff16; --coral:#ff6547; --water:#63b9f3; --violet:#8a6ed6;
  --display:"Bahnschrift Condensed","Bahnschrift","Arial Narrow",sans-serif;
  --body:"Segoe UI","Inter",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code","Consolas",ui-monospace,monospace;
  --frame:color-mix(in srgb, var(--gold) 45%, transparent);   /* moldura padrão .45 */
  --frame-i:color-mix(in srgb, var(--gold) 65%, transparent);  /* interativo .65 (contraste 3:1) */
  --hoverline:color-mix(in srgb, var(--gold) 70%, transparent);
  --thhover:color-mix(in srgb, var(--gold) 6%, transparent);
  --trail:color-mix(in srgb, var(--bone) 8%, transparent);
  --radius:2px;
  --sidebar-w:216px;
  /* escala de densidade — sobrescrita por [data-density=compact] */
  --pad-lg:24px; --pad-md:16px; --pad-sm:12px; --pad-xs:8px;
  --fs-body:14px; --fs-small:13px; --fs-label:11px; --fs-h1:28px; --fs-h2:16px;
  --row-pad:12px;
}
[data-density="compact"]{
  --pad-lg:16px; --pad-md:10px; --pad-sm:8px; --pad-xs:5px;
  --fs-body:13px; --fs-small:12px; --fs-label:10px; --fs-h1:23px; --fs-h2:14px;
  --row-pad:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--coal); color:var(--bone); font-family:var(--body);
  font-size:var(--fs-body); line-height:1.55; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;}  /* focus water 2px universal */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.disp{font-family:var(--display);letter-spacing:.04em;}
.uc{text-transform:uppercase;}
[hidden]{display:none !important;}

/* ---------- moldura ornamental 12×12 (só onde a spec permite) ---------- */
.ornament{position:relative;border:1px solid var(--frame);}
.ornament::before,.ornament::after{content:"";position:absolute;width:12px;height:12px;border:solid var(--gold);}
.ornament::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.ornament::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0;}

/* ============================ LAYOUT ============================ */
#app{display:grid;grid-template-rows:44px 1fr;height:100vh;}

/* ---------- Barra de sistema global (44px) ---------- */
#sysbar{
  height:44px;display:flex;align-items:center;gap:18px;padding:0 16px;
  border-bottom:1px solid var(--frame);background:rgba(14,18,17,.96);
  position:relative;z-index:40;
}
#sysbar .brand{font-family:var(--display);font-weight:800;letter-spacing:.10em;font-size:15px;}
#sysbar .brand b{color:var(--acid);}
#sysbar .brand small{color:var(--muted);font-weight:400;font-size:10px;letter-spacing:.14em;}
.sys-sep{width:1px;height:22px;background:var(--frame);}
.vram-widget{display:flex;align-items:center;gap:9px;font-size:var(--fs-label);letter-spacing:.06em;color:var(--muted);}
.vram-widget .mono{color:var(--bone);font-size:12px;}
.vram-bar{width:120px;height:6px;background:var(--trail);border-radius:var(--radius);overflow:hidden;}
.vram-bar > i{display:block;height:100%;border-radius:var(--radius);}
.sys-chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--frame-i);
  border-radius:var(--radius);font-size:var(--fs-label);letter-spacing:.05em;color:var(--muted);
}
.sys-chip:hover{border-color:var(--hoverline);color:var(--bone);}
.sys-chip b{color:var(--gold);font-family:var(--mono);}
#sysbar .spacer{flex:1;}
/* conexão 3 estados */
.conn{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-label);letter-spacing:.06em;}
.conn .dot{width:8px;height:8px;border-radius:50%;}
.conn[data-state="live"]{color:var(--acid);} .conn[data-state="live"] .dot{background:var(--acid);box-shadow:0 0 6px var(--acid);}
.conn[data-state="stale"]{color:var(--gold);} .conn[data-state="stale"] .dot{background:var(--gold);}
.conn[data-state="offline"]{color:var(--coral);} .conn[data-state="offline"] .dot{background:var(--coral);}
.conn .recon{border:1px solid var(--coral);color:var(--coral);padding:2px 7px;border-radius:var(--radius);font-size:10px;}
.demo-btn{border:1px dashed var(--frame-i);color:var(--muted);padding:3px 8px;border-radius:var(--radius);font-size:10px;letter-spacing:.05em;}
.demo-btn:hover{color:var(--water);border-color:var(--water);}
.bell{position:relative;padding:5px;border-radius:var(--radius);color:var(--muted);}
.bell:hover{color:var(--bone);}
.bell .cnt{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--coral);color:var(--coal);font-size:10px;font-weight:800;display:grid;place-items:center;font-family:var(--mono);}
.icn{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}

/* ---------- corpo: sidebar + main ---------- */
#body{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:0;transition:grid-template-columns .18s ease;}
#app[data-collapsed="true"] #body{grid-template-columns:64px 1fr;}

/* ---------- Sidebar ---------- */
#sidebar{border-right:1px solid var(--frame);background:var(--panel);display:flex;flex-direction:column;min-height:0;}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--frame);}
.side-top .lbl{font-family:var(--display);font-size:11px;letter-spacing:.16em;color:var(--muted);}
#app[data-collapsed="true"] .side-top .lbl{display:none;}
.collapse-btn{color:var(--muted);padding:4px;border-radius:var(--radius);}
.collapse-btn:hover{color:var(--acid);}
nav.side-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 10px 10px 15px;font-family:var(--display);font-size:13px;letter-spacing:.05em;
  color:var(--bone);text-transform:uppercase;border-left:3px solid transparent;
}
.nav-item:hover{background:color-mix(in srgb,var(--gold) 6%,transparent);}
.nav-item[aria-current="page"]{color:var(--acid);border-left-color:var(--acid);background:color-mix(in srgb,var(--acid) 6%,transparent);}
.nav-item .ni{flex-shrink:0;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav-item .txt{flex:1;white-space:nowrap;overflow:hidden;}
#app[data-collapsed="true"] .nav-item .txt{display:none;}
#app[data-collapsed="true"] .nav-item{justify-content:center;padding:12px 0;gap:0;}
.nav-badge{
  min-width:18px;height:16px;padding:0 5px;border-radius:8px;font-size:10px;font-weight:800;font-family:var(--mono);
  display:inline-grid;place-items:center;border:1px solid var(--gold);color:var(--gold);
}
#app[data-collapsed="true"] .nav-item .nav-badge{position:absolute;top:5px;right:6px;transform:scale(.8);}
.side-foot{border-top:1px solid var(--frame);padding:10px 12px;}
.side-foot .cap{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:7px;font-family:var(--display);}
#app[data-collapsed="true"] .side-foot .cap{display:none;}
.density-switch{display:flex;border:1px solid var(--frame-i);border-radius:var(--radius);overflow:hidden;}
.density-switch button{flex:1;padding:6px 4px;font-family:var(--display);font-size:10px;letter-spacing:.08em;color:var(--muted);}
.density-switch button[aria-pressed="true"]{background:var(--acid);color:var(--coal);font-weight:700;}
#app[data-collapsed="true"] .density-switch{flex-direction:column;}
#app[data-collapsed="true"] .density-switch button{font-size:9px;padding:5px 2px;}

/* ---------- main / views ---------- */
main#view{overflow-y:auto;min-height:0;padding:0;position:relative;}
.view-inner{padding:var(--pad-lg);max-width:1480px;margin:0 auto;}

/* Cabeçalho de aba */
.tab-head{margin-bottom:var(--pad-lg);}
.tab-head .crumb{font-size:var(--fs-label);letter-spacing:.12em;color:var(--muted);margin-bottom:8px;font-family:var(--display);text-transform:uppercase;}
.tab-head .crumb a:hover{color:var(--acid);}
.tab-h1{
  font-family:var(--display);font-size:var(--fs-h1);font-weight:800;letter-spacing:.02em;
  text-transform:uppercase;margin:0;line-height:1;padding:12px 0 12px 16px;position:relative;
}
.tab-h1 span{color:var(--coral);}
.tab-head-orn{border:1px solid var(--frame);position:relative;padding-left:0;}
.tab-head-orn::before,.tab-head-orn::after{content:"";position:absolute;width:12px;height:12px;border:solid var(--gold);}
.tab-head-orn::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.tab-head-orn::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0;}
.tab-head-orn .tab-h1{border:none;}
.tab-sub{color:var(--muted);font-size:var(--fs-small);margin:8px 0 0 16px;}

/* labels / th */
.lbl{font-family:var(--display);font-size:var(--fs-label);letter-spacing:.10em;text-transform:uppercase;color:var(--muted);}

/* cards */
.card{border:1px solid var(--frame);border-radius:var(--radius);background:var(--panel);padding:var(--pad-md);}
.card.plain{border-color:transparent;background:transparent;padding:0;}
.card h2,.card-h2{font-family:var(--display);font-size:var(--fs-h2);letter-spacing:.05em;color:var(--gold);margin:0 0 10px;text-transform:uppercase;}
.grid{display:grid;gap:var(--pad-md);}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}

/* stat tiles */
.stat{border:1px solid var(--frame);border-radius:var(--radius);padding:var(--pad-md);background:var(--panel);}
.stat .k{font-family:var(--display);font-size:var(--fs-label);letter-spacing:.10em;text-transform:uppercase;color:var(--muted);}
.stat .v{font-family:var(--mono);font-size:24px;margin-top:6px;color:var(--bone);}
[data-density="compact"] .stat .v{font-size:20px;}
.stat .d{font-size:11px;color:var(--muted);margin-top:2px;}

/* barras (acid→gold>75→coral>90) */
.meter{height:6px;background:var(--trail);border-radius:var(--radius);overflow:hidden;}
.meter > i{display:block;height:100%;border-radius:var(--radius);}

/* semáforo — forma redunda cor */
.sig{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-small);}
.sig .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sig.ok{color:var(--acid);} .sig.ok .dot{background:var(--acid);}
.sig.warn{color:var(--gold);} .sig.err{color:var(--coral);}
.sig.off{color:var(--muted);} .sig.off .dot{background:var(--muted);}

/* badges (ponto+texto; preenchido só p/ crítico) */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:var(--radius);border:1px solid var(--frame-i);font-family:var(--display);text-transform:uppercase;}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge.ok{color:var(--acid);border-color:color-mix(in srgb,var(--acid) 40%,transparent);} .badge.ok .dot{background:var(--acid);}
.badge.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);} .badge.warn .dot{background:var(--gold);}
.badge.info{color:var(--water);border-color:color-mix(in srgb,var(--water) 40%,transparent);} .badge.info .dot{background:var(--water);}
.badge.batch{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent);} .badge.batch .dot{background:var(--violet);}
.badge.crit{background:var(--coral);color:var(--coal);border-color:var(--coral);font-weight:800;}
.badge.crit-end{background:var(--coral);color:var(--coal);border-color:var(--coral);font-weight:800;}

/* tabelas */
table.dt{width:100%;border-collapse:collapse;font-size:var(--fs-small);}
table.dt th{font-family:var(--display);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-align:left;padding:var(--row-pad) 12px;border-bottom:1px solid var(--frame);white-space:nowrap;}
table.dt td{padding:var(--row-pad) 12px;border-bottom:1px solid color-mix(in srgb,var(--gold) 12%,transparent);}
table.dt tbody tr:hover{background:var(--thhover);}
table.dt td.num,table.dt th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
table.dt tbody tr:last-child td{border-bottom:none;}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--frame-i);border-radius:var(--radius);font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone);}
.btn:hover{border-color:var(--hoverline);}
.btn.acid{border-color:var(--acid);color:var(--acid);} .btn.acid:hover{background:var(--acid);color:var(--coal);}
.btn.coral{border-color:var(--coral);color:var(--coral);} .btn.coral:hover{background:var(--coral);color:var(--coal);}
.btn.gold{border-color:var(--gold);color:var(--gold);} .btn.gold:hover{background:var(--gold);color:var(--coal);}
.btn.sm{padding:4px 9px;font-size:11px;}
.text-link{color:var(--acid);border-bottom:1px solid var(--acid);display:inline-flex;gap:8px;align-items:center;font-family:var(--display);font-size:12px;letter-spacing:.05em;padding-bottom:2px;}

/* toggle role=switch 40x20 */
.toggle{width:40px;height:20px;border-radius:11px;border:1px solid var(--frame-i);background:var(--trail);position:relative;flex-shrink:0;padding:0;transition:background .15s;}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s;}
.toggle[aria-checked="true"]{background:color-mix(in srgb,var(--acid) 30%,transparent);border-color:var(--acid);}
.toggle[aria-checked="true"]::after{left:22px;background:var(--acid);}

/* role chips allow/block/herdado */
.rchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:var(--radius);border:1px solid;font-family:var(--display);letter-spacing:.04em;}
.rchip.allow{color:var(--acid);border-color:color-mix(in srgb,var(--acid) 50%,transparent);}
.rchip.block{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 50%,transparent);}
.rchip.inherit{color:var(--muted);border-style:dashed;border-color:var(--frame);}
.rchip button{opacity:.7;} .rchip button:hover{opacity:1;}

/* inline input */
.inl{background:var(--coal);border:1px solid var(--frame-i);border-radius:var(--radius);color:var(--bone);font-family:var(--mono);font-size:12px;padding:5px 8px;width:90px;}
.inl:focus{border-color:var(--water);}
input.txt,textarea.txt,select.sel{background:var(--coal);border:1px solid var(--frame-i);border-radius:var(--radius);color:var(--bone);font-family:var(--body);font-size:13px;padding:8px 10px;width:100%;}
textarea.txt{resize:vertical;min-height:70px;}
select.sel{font-family:var(--display);letter-spacing:.04em;}

/* barra fixa de diff/alterações pendentes */
.diffbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid var(--gold);border-radius:var(--radius);background:color-mix(in srgb,var(--gold) 10%,var(--panel));
  padding:10px 14px;margin-top:var(--pad-md);}
.diffbar .n{font-family:var(--display);color:var(--gold);letter-spacing:.05em;}

/* master-detail */
.md{display:grid;grid-template-columns:300px 1fr;gap:var(--pad-md);align-items:start;}
[data-density="compact"] .md{grid-template-columns:260px 1fr;}
.md-list{border:1px solid var(--frame);border-radius:var(--radius);overflow:hidden;}
.md-row{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid color-mix(in srgb,var(--gold) 12%,transparent);}
.md-row:hover{background:var(--thhover);}
.md-row[aria-current="true"]{background:color-mix(in srgb,var(--acid) 8%,transparent);border-left:3px solid var(--acid);padding-left:9px;}
.md-row .nm{font-family:var(--display);letter-spacing:.04em;font-size:14px;}
.md-row .mt{font-size:11px;color:var(--muted);display:flex;gap:8px;margin-top:3px;align-items:center;}

/* sub-tabs */
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--frame);margin-bottom:var(--pad-md);}
.subtab{padding:8px 14px;font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.subtab[aria-selected="true"]{color:var(--acid);border-bottom-color:var(--acid);}
.subtab:hover{color:var(--bone);}

/* matriz */
.matrix-wrap{overflow:auto;border:1px solid var(--frame);border-radius:var(--radius);max-height:60vh;}
table.matrix{border-collapse:collapse;font-size:12px;}
table.matrix th,table.matrix td{border:1px solid color-mix(in srgb,var(--gold) 15%,transparent);padding:6px 8px;text-align:center;white-space:nowrap;}
table.matrix thead th{position:sticky;top:0;background:var(--panel);z-index:2;color:var(--gold);font-family:var(--display);letter-spacing:.05em;}
table.matrix tbody th{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;color:var(--bone);font-family:var(--display);}
.mcell{width:100%;height:100%;min-width:46px;padding:6px 4px;font-size:14px;font-family:var(--mono);}
.mcell.inherit{color:var(--muted);} .mcell.allow{color:var(--acid);} .mcell.block{color:var(--coral);}
.mcell:hover{background:var(--thhover);}

/* filtros */
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--frame);padding-bottom:10px;margin-bottom:var(--pad-md);}
.filters .fbtn{font-family:var(--display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;padding:3px 2px;}
.filters .fbtn[aria-pressed="true"]{color:var(--acid);border-bottom-color:var(--acid);}
.filters .search{margin-left:auto;}
.filters .search input{width:200px;}

/* Grill cards */
.grill-layout{display:grid;grid-template-columns:1fr 280px;gap:var(--pad-md);align-items:start;}
[data-density="compact"] .grill-layout{grid-template-columns:1fr 250px;}
.qcard{border:1px solid var(--frame);border-left-width:3px;border-radius:var(--radius);padding:var(--pad-md);margin-bottom:var(--pad-md);background:var(--panel);}
.qcard.sev-alta{border-left-color:var(--coral);} .qcard.sev-media{border-left-color:var(--gold);} .qcard.sev-baixa{border-left-color:var(--water);}
.qcard .qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.qcard .qnum{font-family:var(--mono);color:var(--muted);font-size:12px;}
.qcard .qtitle{font-size:15px;margin:4px 0 8px;}
.qcard .evidence{border:1px solid var(--frame);border-radius:var(--radius);background:var(--coal);padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0;}
.qcard .qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.qcard.resolved{border-left-color:var(--muted);opacity:.75;}
.qcard.collapsed .qbody{display:none;}
.qcard .resolved-line{display:none;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.qcard.collapsed .resolved-line{display:flex;}
.grill-summary{border:1px solid var(--frame);border-radius:var(--radius);padding:var(--pad-md);position:sticky;top:0;background:var(--panel);}
.grill-summary .sline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--gold) 12%,transparent);font-size:13px;}
.grill-summary .sline .mono{color:var(--bone);}

/* popover perfil */
.popover{position:absolute;z-index:60;min-width:240px;border:1px solid var(--gold);border-radius:var(--radius);background:var(--panel);padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);}
.popover h4{font-family:var(--display);color:var(--gold);margin:0 0 8px;letter-spacing:.05em;font-size:14px;text-transform:uppercase;}

/* drawers */
.drawer{position:fixed;top:0;right:0;height:100vh;width:380px;background:var(--panel);border-left:1px solid var(--gold);z-index:70;
  transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
.drawer.open{transform:none;}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--frame);}
.drawer .dh h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;margin:0;color:var(--gold);font-size:15px;}
.drawer .db{flex:1;overflow-y:auto;padding:14px 16px;}
.drawer .close{color:var(--muted);padding:4px;} .drawer .close:hover{color:var(--coral);}

/* --------- sparkline em canvas --------- */
function drawSpark(canvas, data, opts={}){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth||160, h=canvas.clientHeight||36;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data), max=Math.max(...data), rng=(max-min)||1;
  const thr=opts.threshold; // valor absoluto p/ trocar cor
  const pts=data.map((v,i)=>[ (i/(data.length-1))*(w-4)+2, h-4-((v-min)/rng)*(h-8) ]);
  // cor por estado (D6): monocromática acid, vira gold/coral ao cruzar threshold
  let col="var(--acid)";
  const last=data[data.length-1];
  if(thr){ if(last>thr.coral) col=getVar("--coral"); else if(last>thr.gold) col=getVar("--gold"); else col=getVar("--acid"); }
  else col=getVar("--acid");
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.beginPath();
  if(opts.stale){ // linha interrompida — nunca continuação falsa
    ctx.setLineDash([3,3]);
  }
  pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.stroke();
  ctx.setLineDash([]);
}
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function rndSeries(n, base, jit){ const a=[]; let v=base; for(let i=0;i<n;i++){ v=Math.max(1, v+(Math.sin(i*1.3)+Math.cos(i*0.7))*jit); a.push(Math.round(v)); } return a; }

    ${crumb?`<div class="crumb">${crumb}</div>`:""}
    <div class="tab-head-orn"><h1 class="tab-h1">${h1a} <span>${h1coral}</span>${h1b?" "+h1b:""}</h1></div>
    ${sub?`<p class="tab-sub">${sub}</p>`:""}
  </div>`;
}

function statTile(k,v,d,cid){
  return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div>
    <canvas class="spark" id="${cid}" style="width:100%;height:30px;margin-top:8px"></canvas></div>`;
}
function prioChip(p){
  if(p==="interativa") return '<span class="badge ok"><span class="dot"></span>interativa</span>';
  if(p==="batch") return '<span class="badge batch"><span class="dot"></span>batch</span>';
  return '<span class="badge" style="color:var(--bone)"><span class="dot" style="background:var(--bone)"></span>normal</span>';
}

let workerSub = "detail"; // detail | matriz

function viewWorkers(){
  const parts = location.hash.split("/");

function workersDetail(){
  const list = WORKERS.map(w=>`
    <button class="md-row" data-wsel="${w.id}" ${w.id===workerSel?'aria-current="true"':""}>
      <div class="nm">${esc(w.name)}</div>

        <span class="muted">· ${w.jobs} jobs</span>
        <span class="muted">· ${w.cfg}</span>
      </div>
    </button>`).join("");

    <div class="md-list">${list}</div>
    <div id="wdetail">${workerDetailBody(WORKERS.find(w=>w.id===workerSel))}</div>
  </div>`;
}

function workerDetailBody(w){
  if(!w) return "";
  const d = workerDrafts[w.id] || {};
  const draftCount = Object.keys(d).length;
  const tokPct = Math.round((w.tokDayUsed/w.tokDay)*100)||0;
  const allowChips = w.allow.map(r=>`<span class="rchip allow">${r}<button data-role-rm="${r}" data-w="${w.id}" aria-label="remover">✕</button></span>`).join("");
  const blockChips = w.block.map(r=>`<span class="rchip block">⊘ ${r}<button data-role-rm="${r}" data-w="${w.id}" aria-label="remover">✕</button></span>`).join("");
  const inherited = ROLES.filter(r=>!w.allow.includes(r)&&!w.block.includes(r)).slice(0,3)
    .map(r=>`<span class="rchip inherit">${r} · herdado</span>`).join("");
  const modelsBlock = w.models ? `<div class="mt-sm"><span class="lbl">Modelos</span><div class="wrap mt-sm">${w.models.map(m=>`<span class="badge info"><span class="dot"></span>${m}</span>`).join("")}</div></div>` : "";
  const blocklistWarn = w.blocklist ? `<div class="wait-banner mt" style="cursor:default;color:var(--coral);border-color:var(--coral)"><svg class="icn" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg> Em blocklist de revisão — todos os papéis proibidos (⊘ *)</div>` : "";
  return `<div class="card">
    <div class="between">
      <div>
        <h2 class="card-h2" style="margin:0">${esc(w.name)}</h2>
        <div class="small muted mt-sm">provider ${w.provider} · vram ${w.vram} · ctx ${w.ctx} · config ${w.cfg}</div>
      </div>
      <div class="row">
        <span class="lbl">${w.on?"ligado":"desligado"}</span>
        <button class="toggle" role="switch" aria-checked="${w.on}" data-wtoggle="${w.id}" aria-label="Liga/desliga worker"></button>
      </div>
    </div>
    ${blocklistWarn}
    ${modelsBlock}

    <div class="mt" style="border-top:1px solid var(--frame);padding-top:12px">
      <div class="between"><span class="section-lbl">Papéis (allow / block / herdado)</span>
        <input class="txt" style="width:180px" placeholder="/ buscar papel…" aria-label="Buscar papel"></div>
      <div class="wrap mt-sm">${allowChips}${blockChips}${inherited || '<span class="muted small">sem herança adicional</span>'}</div>
      <div class="small muted mt-sm">Efetivo: <b class="mono" style="color:var(--acid)">${w.allow.length}</b> permitidos · <b class="mono" style="color:var(--coral)">${w.block.length}</b> proibidos</div>
    </div>

    <div class="mt" style="border-top:1px solid var(--frame);padding-top:12px">
      <span class="section-lbl">Limites</span>
      <div class="grid g2 mt-sm">
        <label class="small">Concorrência<br><input class="inl" type="number" value="${d.conc??w.conc}" data-wlim="conc" data-w="${w.id}"></label>
        <label class="small">Tokens / job<br><input class="inl" type="number" value="${d.tokJob??w.tokJob}" data-wlim="tokJob" data-w="${w.id}"></label>
        <label class="small">Keep-alive<br><input class="inl" value="${d.keep??w.keep}" data-wlim="keep" data-w="${w.id}" style="width:90px"></label>
        <label class="small">Temperatura
          <span class="temp-wrap">
            <input class="inl" type="number" step="0.1" min="0" max="1" value="${d.temp??w.temp}" data-wlim="temp" data-w="${w.id}" style="width:70px" aria-describedby="tempTip">
            ${tempTip(d.temp??w.temp)}
          </span>
        </label>
      </div>
      <div class="mt-sm">
        <div class="between"><span class="small">Tokens / dia <span class="mono">${(w.tokDayUsed).toLocaleString("pt-BR")} / ${(w.tokDay).toLocaleString("pt-BR")}</span></span>
          <span class="small ${tokPct>90?'':''}" style="color:${tokPct>90?'var(--coral)':tokPct>75?'var(--gold)':'var(--muted)'}">${tokPct}%${tokPct>75?' ▲':''}</span></div>
        <div class="meter mt-sm"><i style="width:${tokPct}%;background:${barColor(tokPct)}"></i></div>
      </div>
    </div>

    <div class="between mt" style="border-top:1px solid var(--frame);padding-top:12px">
      <button class="text-link" data-audit="${w.id}">ver auditoria · histórico de versões →</button>
      <span class="small muted">última alteração: fable · 18/07 13:12</span>
    </div>
  </div>

  <div class="diffbar" ${draftCount?'':'hidden'} id="diffbar-${w.id}">
    <span class="n">▲ ${draftCount} alteração(ões) pendente(s) neste worker</span>
    <div class="row">

      <button class="btn sm acid" data-wsave="${w.id}">Salvar nova versão</button>
    </div>
  </div>`;
}

function tempTip(t){
  const pct=Math.min(1,Math.max(0,parseFloat(t)||0))*100;
  return `<span class="temp-tip" id="tempTip" role="tooltip">
    <div class="lbl" style="color:var(--gold)">Temperatura ${(+t).toFixed(1)}</div>
    <div class="temp-ruler"><span class="mk" style="left:${pct}%"></span></div>
    <div class="temp-scale"><span>0</span><span>.25</span><span>.5</span><span>.75</span><span>1</span></div>
    <div class="temp-leg">0–0.2 juiz · 0.3–0.5 executor<br>0.6–0.8 explorador · 0.9+ interrogador</div>
  </span>`;
}

function workersMatrix(){
  // init state
  WORKERS.forEach(w=>ROLES.forEach(r=>{
    const k=r+"|"+w.id;
    if(!(k in matrixState)) matrixState[k] = w.allow.includes(r)?"allow": w.block.includes(r)?"block":"inherit";
  }));
  const head2 = `<tr><th style="min-width:150px">papel \\ worker</th>${WORKERS.map(w=>`<th title="${esc(w.name)}">${esc(w.name.replace(':',' '))}</th>`).join("")}</tr>`;
  const rows = ROLES.map(r=>`<tr><th>${r}</th>${WORKERS.map(w=>{
    const k=r+"|"+w.id; const st=matrixState[k];
    const sym = st==="allow"?"✓":st==="block"?"⊘":"·";
    return `<td style="padding:0"><button class="mcell ${st}" data-mcell="${k}" title="clique cicla herdado→permitido→proibido">${sym}</button></td>`;
  }).join("")}</tr>`).join("");
  return `<div class="between mb" style="margin-bottom:10px">
      <label class="row small"><span class="lbl">Projeto</span>
        <select class="sel" style="width:200px" id="matrixProj">${PROJECTS.map(p=>`<option ${p==='painel-v2'?'selected':''}>${p}</option>`).join("")}</select></label>
      <span class="small muted">célula cicla <span style="color:var(--muted)">herdado</span> → <span style="color:var(--acid)">permitido</span> → <span style="color:var(--coral)">proibido</span></span>
    </div>
    <div class="matrix-wrap"><table class="matrix"><thead>${head2}</thead><tbody>${rows}</tbody></table></div>
    <div class="diffbar" id="matrixDiff" ${matrixPending?'':'hidden'}>
      <span class="n">▲ <span id="matrixPendN">${matrixPending}</span> alteração(ões) pendente(s) na matriz</span>
      <div class="row">
        <button class="btn sm" id="matrixDiscard">Descartar</button>
        <button class="btn sm gold" id="matrixApply">Aplicar em lote</button>
      </div>
    </div>`;
}

/* ---- Workers wiring ---- */
function wireWorkers(){
  $$('[data-wsub]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.wsub;
    location.hash = v==="matriz" ? "#/workers/"+workerSel+"?v=matriz" : "#/workers/"+workerSel;
  });
  $$('[data-wsel]').forEach(b=>b.onclick=()=>{ location.hash="#/workers/"+b.dataset.wsel; });

  // toggle liga/desliga
  $$('[data-wtoggle]').forEach(b=>b.onclick=()=>{
    const w=WORKERS.find(x=>x.id===b.dataset.wtoggle);
    w.on=!w.on; b.setAttribute("aria-checked",w.on);
    toast(w.on?"ok":"warn", `${w.name} ${w.on?"ligado":"desligado"}`);
    $("#wdetail").innerHTML=workerDetailBody(w); wireWorkerDetail();
  });
  // remove role chip
  $$('[data-role-rm]').forEach(b=>b.onclick=()=>{
    const w=WORKERS.find(x=>x.id===b.dataset.w);
    w.allow=w.allow.filter(r=>r!==b.dataset.roleRm); w.block=w.block.filter(r=>r!==b.dataset.roleRm);
    (workerDrafts[w.id]=workerDrafts[w.id]||{})["papeis"]=true;
    $("#wdetail").innerHTML=workerDetailBody(w); wireWorkerDetail();
  });
  wireWorkerDetail();

  // matriz
  $$('[data-mcell]').forEach(c=>c.onclick=()=>cycleMatrix(c));
  $("#matrixApply")?.addEventListener("click", ()=>{ matrixPending=0; toast("gold",`Matriz aplicada em lote (${$("#matrixProj")?.value||"painel-v2"})`,"Workers · matriz"); router(); });
  $("#matrixDiscard")?.addEventListener("click", ()=>{ matrixState={}; matrixPending=0; router(); });
}
function wireWorkerDetail(){
  $$('[data-wtoggle]').forEach(b=>b.onclick=()=>{
    const w=WORKERS.find(x=>x.id===b.dataset.wtoggle);
    w.on=!w.on; b.setAttribute("aria-checked",w.on);
    toast(w.on?"ok":"warn", `${w.name} ${w.on?"ligado":"desligado"}`);
    $("#wdetail").innerHTML=workerDetailBody(w); wireWorkerDetail();
  });
  $$('[data-role-rm]').forEach(b=>b.onclick=()=>{
    const w=WORKERS.find(x=>x.id===b.dataset.w);
    w.allow=w.allow.filter(r=>r!==b.dataset.roleRm); w.block=w.block.filter(r=>r!==b.dataset.roleRm);
    (workerDrafts[w.id]=workerDrafts[w.id]||{})["papeis"]=true;
    $("#wdetail").innerHTML=workerDetailBody(w); wireWorkerDetail();
  });
  $$('[data-wlim]').forEach(inp=>inp.oninput=()=>{
    const w=inp.dataset.w, k=inp.dataset.wlim;
    (workerDrafts[w]=workerDrafts[w]||{})[k]=inp.value;
    const bar=$("#diffbar-"+w);
    if(bar){ bar.hidden=false; bar.querySelector(".n").textContent="▲ "+Object.keys(workerDrafts[w]).length+" alteração(ões) pendente(s) neste worker"; }
  });
  $$('[data-wsave]').forEach(b=>b.onclick=()=>{
    const w=WORKERS.find(x=>x.id===b.dataset.wsave);
    // aplica drafts
    const d=workerDrafts[w.id]||{}; ["conc","tokJob","temp"].forEach(k=>{ if(d[k]!==undefined) w[k]=parseFloat(d[k]); }); if(d.keep!==undefined) w.keep=d.keep;
    workerDrafts[w.id]={};
    toast("ok",`${w.name} salvo — nova versão ${bumpCfg(w)}`,"Workers · auditoria");
    $("#wdetail").innerHTML=workerDetailBody(w); wireWorkerDetail();
  });
  $$('[data-wdiscard]').forEach(b=>b.onclick=()=>{
    const w=WORKERS.find(x=>x.id===b.dataset.wdiscard); workerDrafts[w.id]={};
    $("#wdetail").innerHTML=workerDetailBody(w); wireWorkerDetail();
  });
  $$('[data-audit]').forEach(b=>b.onclick=()=>openAudit(b.dataset.audit));
}
function bumpCfg(w){ const n=parseInt(w.cfg.replace("v",""))+1; w.cfg="v"+n; return w.cfg; }

function cycleMatrix(cell){
  const k=cell.dataset.mcell;
  const order=["inherit","allow","block"];
  const cur=matrixState[k]||"inherit";
  const next=order[(order.indexOf(cur)+1)%3];
  matrixState[k]=next;
  cell.className="mcell "+next;
  cell.textContent = next==="allow"?"✓":next==="block"?"⊘":"·";
  matrixPending++;
  const bar=$("#matrixDiff"); if(bar){ bar.hidden=false; $("#matrixPendN").textContent=matrixPending; }
}

function wireGrill(){
  $$('[data-qact]').forEach(b=>b.onclick=()=>grillAction(b.dataset.qact, b.dataset.q, b));
  $$('[data-qexpand]').forEach(b=>b.onclick=()=>{

    const card=$(`.qcard[data-q="${g.n}"]`); card.classList.remove("collapsed","resolved"); card.dataset.state="open"; refreshGrillSummary();
  });
  $$('.filters .fbtn').forEach(b=>b.onclick=()=>{
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true");
    const alta=$('[data-gf="sev-alta"]').getAttribute("aria-pressed")==="true";
    const onlyOpen=$('[data-gf="open"]').getAttribute("aria-pressed")==="true";
    $$('.qcard').forEach(c=>{
      let show=true;
      if(alta && c.dataset.sev!=="alta") show=false;
      if(onlyOpen && c.dataset.state!=="open") show=false;
      c.hidden=!show;
    });
  });
  $("#grillFinish")?.addEventListener("click", ()=>{
    const open=GRILL.filter(g=>g.state==="open").length;
    if(open>0){ toast("warn",`▲ ${open} pergunta(s) ainda aberta(s) — resolva ou aceite risco`); return; }
    showGrillReport();

function grillAction(act, n, btn){
  const g=GRILL.find(x=>x.n===n);
  const card=$(`.qcard[data-q="${n}"]`);
  const slot=card.querySelector(".qslot");
  if(act==="responder"){
    slot.innerHTML=`<label class="small">Resposta<br><textarea class="txt mt-sm" placeholder="Escreva a resposta que resolve a pergunta…"></textarea></label>
      <button class="btn sm acid mt-sm" data-qsubmit="${n}">Enviar resposta</button>`;
    slot.querySelector('[data-qsubmit]').onclick=()=>resolveQ(g,card,"respondida");
  } else if(act==="defender"){
    openDefenderPopover(btn, g);
  } else if(act==="risco"){
    slot.innerHTML=`<div class="small" style="color:var(--coral)">⊘ Aceitar risco exige justificativa (obrigatória).</div>
      <textarea class="txt mt-sm" id="riskJust-${n}" placeholder="Justificativa do risco aceito…"></textarea>
      <button class="btn sm coral mt-sm" data-qrisk="${n}">Confirmar aceite de risco</button>`;
    slot.querySelector('[data-qrisk]').onclick=()=>{
      const v=$("#riskJust-"+n).value.trim();
      if(!v){ toast("err","⊘ Justificativa obrigatória para aceitar risco"); return; }
      window.__risk=(window.__risk||0)+1; const gr=$("#gsRisk"); if(gr) gr.textContent=window.__risk;
      resolveQ(g,card,"risco aceito");
    };
  } else if(act==="descartar"){
    slot.innerHTML=`<label class="small">Motivo curto<br><input class="txt mt-sm" placeholder="motivo do descarte…" id="disc-${n}"></label>
      <button class="btn sm mt-sm" data-qdisc="${n}">Descartar</button>`;
    slot.querySelector('[data-qdisc]').onclick=()=>resolveQ(g,card,"descartada");
  }
}
function resolveQ(g,card,how){
  g.state="resolved";
  card.classList.add("collapsed","resolved"); card.dataset.state="resolved";
  card.querySelector(".qslot").innerHTML="";
  toast("ok",`${g.n} ${how} → colapsada em linha`);
  refreshGrillSummary();
}
function refreshGrillSummary(){
  const open=GRILL.filter(g=>g.state==="open").length;
  if($("#gsOpen")) $("#gsOpen").textContent=open;
  if($("#gsDone")) $("#gsDone").textContent=GRILL.length-open;
}
function openDefenderPopover(btn, g){
  closePopover();
  const prof=AGENT_PROFILES["critico"];
  const pop=document.createElement("div"); pop.className="popover"; pop.id="defPop";
  pop.innerHTML=`<h4>Defender ${g.n} com agente</h4>
    <div class="small">Perfil: <b class="disp" style="color:var(--acid)">critico</b></div>
    <div class="small muted mt-sm">${prof.desc}</div>
    <div class="small mt-sm">Modelo sugerido: <span class="mono">${prof.model}</span> · temp ${prof.temp}</div>
    <button class="btn sm gold mt" id="defRun">▸ Lançar defesa (job acompanhável)</button>`;
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect();
  pop.style.top=(r.bottom+window.scrollY+6)+"px"; pop.style.left=(r.left+window.scrollX)+"px";
  $("#defRun").onclick=()=>{ closePopover(); toast("info",`Defesa de ${g.n} lançada · critico/${prof.model}`,"Orquestrador · job #240"); };
  setTimeout(()=>document.addEventListener("click",closePopoverOnce),0);
}
function closePopoverOnce(e){ if(!e.target.closest("#defPop")){ closePopover(); document.removeEventListener("click",closePopoverOnce); } }
function closePopover(){ $("#defPop")?.remove(); }
function showGrillReport(){
  const rep=$("#grillReport"); if(!rep) return;
  rep.hidden=false;
  rep.innerHTML=`<div class="goldband"><svg class="icn" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> RELATÓRIO PRONTO</div>
    <div class="ornament mt" style="padding:18px">
      <h2 class="card-h2">Relatório da grelha · painel-v2</h2>
      <p class="small">Todas as ${GRILL.length} perguntas resolvidas. Riscos aceitos: <b class="mono">${window.__risk||0}</b>.</p>
      <table class="dt mt-sm"><thead><tr><th>Nº</th><th>Categoria</th><th>Severidade</th><th>Desfecho</th></tr></thead><tbody>
        ${GRILL.map(g=>`<tr><td class="mono">${g.n}</td><td>${g.cat}</td><td>${g.sev}</td><td><span class="sig ok"><span class="dot"></span>resolvida</span></td></tr>`).join("")}
      </tbody></table>
    </div>`;
  rep.scrollIntoView({behavior:"smooth"});
  toast("ok","Relatório do Grill gerado","Grill Me");
}

/* ---- Tools wiring ---- */
function wireTools(){
  $$('[data-tsub]').forEach(b=>b.onclick=()=>{ toolsSub=b.dataset.tsub; $("#tsubbody").innerHTML= toolsSub==='servers'?toolsServers():toolsSub==='catalog'?toolsCatalog():toolsRuntime(); $$('[data-tsub]').forEach(x=>x.setAttribute("aria-selected", x.dataset.tsub===toolsSub)); wireToolsInner(); });
  wireToolsInner();
}
function wireToolsInner(){
  $$('[data-tauth]').forEach(b=>b.onclick=()=>{
    openModal("Autenticação OAuth · "+b.dataset.tauth, `
      <p class="small muted">Fluxo OAuth via <span class="mono">PUT .../auth</span>. Segredos mascarados.</p>
      <label class="small mt">Client ID<br><input class="txt mt-sm" value="mcp-client-••••7f2a" readonly></label>
      <label class="small mt" style="display:block">Client secret<br><input class="txt mt-sm" type="password" value="················"></label>`,
      [{t:"Cancelar",cls:"",fn:closeModal},{t:"Autorizar",cls:"acid",fn:()=>{closeModal();toast("ok",b.dataset.tauth+" autenticado (OAuth)","Tools");}}]);
  });
  $("#runTool")?.addEventListener("click", ()=>toast("info","nvidia_gpu_status executado — VRAM 8.2/12 GB","Tools · catálogo"));
  $("#runTool2")?.addEventListener("click", ()=>{
    const r=$("#toolResult"); if(r) r.innerHTML=`<div class="card" style="padding:10px"><div class="lbl">Resultado</div><div class="small mt-sm">Geração concluída.</div><div class="lbl mt-sm">Raciocínio</div><div class="small muted">cadeia interna omitida.</div><pre class="mono small" style="background:var(--coal);padding:8px;border:1px solid var(--frame);margin-top:6px">{ "tokens": 812, "model": "qwen3-coder:30b" }</pre></div>`;
  });
  $$('[data-stop]').forEach(b=>b.onclick=()=>stopContainer(b.dataset.stop));
}
function stopContainer(name){
  const critical = name==="painel-web";
  if(!critical){
    openModal("Parar container · "+name, `<p class="small">Isto interrompe <b>${name}</b>. Ação disruptiva, reversível ao reiniciar.</p>
      <div class="cmdline" style="color:var(--gold);border-color:var(--gold)">docker stop ${name}</div>`,
      [{t:"Cancelar",cls:"",fn:closeModal,focus:true},{t:"Parar",cls:"coral",fn:()=>{closeModal();toast("warn",`Container ${name} parado`,"Tools · runtime");}}], "danger");
    return;
  }
  // crítico: digitar o nome
  openModal("⊘ Parar o container DESTE painel", `
    <p class="small" style="color:var(--coral)">Você vai parar <b>${name}</b> — o container que serve este painel. <b>A conexão será perdida.</b></p>
    <p class="small muted">Comando literal executado ao confirmar:</p>
    <div class="cmdline">docker stop ${name} &amp;&amp; echo "painel offline"</div>
    <label class="small">Para confirmar, digite <b class="mono" style="color:var(--coral)">${name}</b>:<br>
      <input class="txt mt-sm" id="critName" placeholder="${name}" autocomplete="off"></label>`,
    [{t:"Cancelar",cls:"",fn:closeModal,focus:true},{t:"Parar painel",cls:"coral",id:"critOk",disabled:true,fn:()=>{closeModal();toast("err","painel-web parado — conexão encerrada (simulado)","Tools");}}], "danger");
  const inp=$("#critName"), ok=$("#critOk");
  inp.oninput=()=>{ const m=inp.value.trim()===name; ok.disabled=!m; ok.style.opacity=m?"1":".5"; };
  ok.style.opacity=".5";
}

/* ---- Instruções wiring ---- */
function wireInstr(){
  const ed=$("#instrEditor"), pv=$("#instrPreview"), cc=$("#charCount");
  const upd=()=>{ pv.innerHTML=renderMd(ed.value); cc.textContent=ed.value.length; };
  upd();
  ed.oninput=()=>{ instrDirty=true; upd(); };
  $("#instrSave").onclick=()=>{ instrDirty=false; toast("ok","Instruções salvas (documento único)","Instruções"); };
  $("#instrReset").onclick=()=>{
    if(instrDirty){
      openModal("Alterações não salvas", `<p class="small">Há alterações não salvas. Reverter descarta o que você editou.</p>`,
        [{t:"Continuar editando",cls:"",fn:closeModal,focus:true},{t:"Reverter",cls:"coral",fn:()=>{ed.value=INSTR_TEXT;instrDirty=false;upd();closeModal();toast("warn","Instruções revertidas");}}],"danger");
    } else { ed.value=INSTR_TEXT; upd(); }
  };
}

/* ============================================================
   DRAWERS
   ============================================================ */
function openDrawer(id){ const d=$("#"+id); d.classList.add("open"); d.setAttribute("aria-hidden","false"); }
function closeDrawer(id){ const d=$("#"+id); d.classList.remove("open"); d.setAttribute("aria-hidden","true"); }
$$('[data-close-drawer]').forEach(b=>b.onclick=()=>closeDrawer(b.dataset.closeDrawer));

function openFila(){
  const body=$("#filaBody");
  body.innerHTML = QUEUE.length ? QUEUE.map(q=>`
    <div class="qitem">
      <div class="qtop"><span class="disp" style="color:var(--gold)">${esc(q.res)}</span> ${prioChip(q.prio)}</div>
      <div class="small">Dono: <a class="text-link" href="#/orquestrador" data-fila-owner>${esc(q.owner)}</a></div>
      <div class="qmeta"><span>posição na fila</span><span class="mono">#${q.pos}</span></div>
    </div>`).join("") + `<p class="small muted mt">Fonte única (§3.6): mesma fila do Status e dos banners de "aguardando_recurso".</p>`
    : '<p class="muted">Nenhum recurso disputado.</p>';
  openDrawer("drawerFila");
  $$('[data-fila-owner]').forEach(a=>a.onclick=()=>closeDrawer("drawerFila"));
}
$("#chipVram").onclick=openFila;
$("#chipFila").onclick=openFila;

function renderNotifs(){
  $("#notifBody").innerHTML = NOTIFS.map(n=>`<div class="notif ${n.kind}"><div class="nt">${esc(n.txt)}</div><div class="nm">${esc(n.when)}</div></div>`).join("")
    + `<p class="small muted mt">Histórico dos últimos 50 toasts.</p>`;
}
$("#bellBtn").onclick=()=>{ renderNotifs(); openDrawer("drawerNotif"); };

function openAudit(wid){
  const w=WORKERS.find(x=>x.id===wid);
  $("#auditBody").innerHTML=`
    <div class="small muted mb" style="margin-bottom:10px">Histórico de versões · ${esc(w.name)}</div>
    ${[["v"+(parseInt(w.cfg.replace('v',''))),"fable","18/07 13:12","temp 0.5 → 0.4; tokens/job 6144 → 8192"],
       ["v"+(parseInt(w.cfg.replace('v',''))-1),"gpt-5.6-sol","17/07 20:40","+ papel executor_complexo"],
       ["v"+(parseInt(w.cfg.replace('v',''))-2),"operador","17/07 09:02","concorrência 1 → 2"]].map((v,i)=>`
      <div class="qitem">
        <div class="qtop"><span class="disp" style="color:var(--acid)">config ${v[0]}</span><span class="small muted">${v[2]}</span></div>
        <div class="small">ator: <b class="disp">${v[1]}</b></div>
        <div class="evidence" style="margin:8px 0">
          <span style="color:var(--coral)">- ${esc(v[3].split(';')[0])}</span><br>
          <span style="color:var(--acid)">+ ${esc(v[3].split(';').slice(-1)[0].trim())}</span>
        </div>
        ${i>0?`<button class="btn sm gold" data-restore="${v[0]}">Restaurar esta versão</button>`:'<span class="badge ok"><span class="dot"></span>versão atual</span>'}
      </div>`).join("")}`;
  openDrawer("drawerAudit");
  $$('[data-restore]').forEach(b=>b.onclick=()=>{ closeDrawer("drawerAudit"); toast("gold",`Config ${b.dataset.restore} restaurada em ${w.name}`,"Workers · auditoria"); });
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(title, bodyHtml, buttons, variant){
  $("#modalTitle").textContent=title;
  $("#modalBody").innerHTML=bodyHtml;
  const m=$("#modal"); m.className="modal"+(variant==="danger"?" danger":"");
  const foot=$("#modalFoot"); foot.innerHTML="";
  buttons.forEach(b=>{
    const btn=document.createElement("button");
    btn.className="btn"+(b.cls?" "+b.cls:"");
    btn.textContent=b.t; if(b.id) btn.id=b.id; if(b.disabled) btn.disabled=true;
    btn.onclick=b.fn; foot.appendChild(btn);
    if(b.focus) setTimeout(()=>btn.focus(),20); // foco inicial em Cancelar em danger
  });
  $("#scrim").classList.add("open");
}
function closeModal(){ $("#scrim").classList.remove("open"); }
$("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeModal(); });

/* ============================================================
   SYSBAR — conexão demo + VRAM live + collapse + densidade
   ============================================================ */
const connStates=[
  {s:"live", txt:"ao vivo", recon:false},
  {s:"stale", txt:"dados de 8s atrás", recon:false},
  {s:"offline", txt:"offline", recon:true},
];
let connIdx=0;
$("#connDemo").onclick=()=>{
  connIdx=(connIdx+1)%3;
  const c=connStates[connIdx], el=$("#conn");
  el.dataset.state=c.s;
  el.querySelector(".lbl-txt").textContent=c.txt;
  el.querySelector(".recon").hidden=!c.recon;
  if(c.s==="stale") toast("warn","▲ Conexão stale — dados envelhecendo (sparklines interrompem)");
  if(c.s==="offline") toast("err","⊘ Offline — reconectando…");
  if(c.s==="live") toast("ok","Conexão restabelecida · ao vivo");
};
$("#conn .recon").onclick=()=>{ connIdx=0; $("#connDemo").click(); connIdx=0; const c=connStates[0],el=$("#conn"); el.dataset.state="live"; el.querySelector(".lbl-txt").textContent="ao vivo"; el.querySelector(".recon").hidden=true; };

// VRAM viva
let vram=8.2;
setInterval(()=>{
  vram = Math.max(6.5, Math.min(11.2, vram + (Math.random()-0.5)*0.6));
  const pct=Math.round(vram/12*100);
  const f=$("#vramFill"), t=$("#vramTxt");
  if(f){ f.style.width=pct+"%"; f.style.background=barColor(pct); }
  if(t) t.textContent=vram.toFixed(1)+" / 12 GB";
},2500);

$("#collapseBtn").onclick=()=>{
  const app=$("#app"); const c=app.dataset.collapsed==="true";
  app.dataset.collapsed=(!c).toString();
};

$("#dBal").onclick=()=>setDensity("balanced");
$("#dCmp").onclick=()=>setDensity("compact");
function setDensity(d){
  document.body.dataset.density=d;
  $("#dBal").setAttribute("aria-pressed", d==="balanced");
  $("#dCmp").setAttribute("aria-pressed", d==="compact");
  // redesenha sparklines na densidade nova
  router();
}

/* keyboard: Esc fecha, / foca filtro, ? ajuda */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeModal(); ["drawerFila","drawerNotif","drawerAudit"].forEach(closeDrawer); closePopover(); }
  if(e.key==="/" && !/input|textarea/i.test(e.target.tagName)){ const f=$('input[placeholder^="/"]'); if(f){ e.preventDefault(); f.focus(); } }
  if(e.key==="?" ){ if(!/input|textarea/i.test(e.target.tagName)){ openModal("Atalhos (v1)", `<div class="small" style="line-height:2"><span class="mono">/</span> focar filtro · <span class="mono">Ctrl+Enter</span> confirmar · <span class="mono">Esc</span> fechar · <span class="mono">?</span> esta ajuda</div>`,[{t:"Fechar",cls:"acid",fn:closeModal,focus:true}]); } }
});

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener("hashchange", router);
updateBell();
router();
