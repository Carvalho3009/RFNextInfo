services:
  supervisor:
    build: .
    image: poke-idle-supervisor:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    shm_size: "1gb"
    environment:
      POKEIDLE_CONFIG: /app/config.yaml
      POKEIDLE_DASHBOARD_TOKEN: "${POKEIDLE_DASHBOARD_TOKEN:?defina POKEIDLE_DASHBOARD_TOKEN}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - pokeidle-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pokeidle-data:
